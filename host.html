<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liêm hay Lách? · Màn hình MC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800;900&family=Noto+Serif:wght@700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
/* ===== Design tokens: "Bàn điều tra" ===== */
:root{
  --desk-0:#120e0b; --desk-1:#1c1611; --desk-2:#2a2119; --desk-line:#3d3125;
  --paper:#f1e6c9; --paper-2:#e4d3a9; --paper-edge:#c9b285;
  --brass:#d9a441; --brass-2:#9c7020; --cream:#f6efe0;
  --stamp-red:#c2352c; --stamp-green:#2e7d4f;
  --tag-a:#c4463a; --tag-b:#2f6fb7; --tag-c:#c98d1f; --tag-d:#3b8a58;
  --f-ui:"Be Vietnam Pro","Segoe UI",Roboto,Arial,sans-serif;
  --f-doc:"Noto Serif",Georgia,"Times New Roman",serif;
  --f-mono:"Roboto Mono",Consolas,"Courier New",monospace;
}
.folder, .tag, .hmain .note, .pinnote{
  --ink:#1f1a14;
  --ink-2:#5a4f40;
}
#app{height:100vh;display:grid;grid-template-rows:auto 1fr auto}
#bar{display:flex;align-items:center;gap:14px;padding:10px 24px;border-bottom:1px solid var(--line);background:rgba(8,10,24,.6)}
.brand{font-weight:900;font-size:22px;letter-spacing:.04em;white-space:nowrap}
.brand i{font-weight:500;color:var(--gold)}
#barInfo{display:flex;gap:8px;flex:1;flex-wrap:nowrap;overflow:hidden;min-width:0}
.chip{border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:14px;color:var(--muted);white-space:nowrap}
.chip b{color:var(--ink)}
.chip.act2{border-color:var(--red);color:#ffb3b5}
.chip.off{border-color:var(--red);color:var(--red)}
#bar .trust .tbar{width:110px}
#bar .trust{font-size:14px}
.tools{display:flex;gap:8px}
.tools button{background:transparent;border:1px solid var(--line);border-radius:10px;padding:6px 12px;cursor:pointer;color:var(--muted);font-size:13px;white-space:nowrap}
.tools button:hover{border-color:var(--gold);color:var(--ink)}
.tools button.danger:hover{border-color:var(--red);color:#ffb3b5}
#main{overflow:auto;padding:clamp(12px,2.4vh,30px) clamp(16px,3vw,48px);display:flex;flex-direction:column;gap:clamp(10px,2vh,20px)}
#main>:first-child{margin-top:auto}
#main>:last-child{margin-bottom:auto}
#board{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;padding:10px 20px 14px;border-top:1px solid var(--line);background:rgba(8,10,24,.7)}
#board:empty{display:none}
.tp{min-width:130px;max-width:210px;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:6px 12px;text-align:center}
.tp .n{font-size:14px;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp .s{font-size:24px;font-weight:900;line-height:1.1}
.tp.cnt{background:transparent;border-style:dashed;min-width:100px}
/* setup */
.setup{display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:center;max-width:1200px;width:100%;margin-inline:auto}
@media(max-width:900px){.setup{grid-template-columns:1fr}}
.hero h1{font-size:clamp(46px,10vh,104px);margin:0;line-height:.95;font-weight:900}
.hero h1 i{color:var(--gold);font-weight:500}
.hero p{font-size:clamp(16px,2.4vh,21px);max-width:32em}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;display:grid;gap:12px}
.card h2{margin:0;font-size:20px}
.lbl{font-size:13px;color:var(--muted);margin-bottom:4px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.radio{border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;background:transparent;color:var(--ink);text-align:left}
.radio small{display:block;color:var(--muted);font-size:12px}
.radio.on{border-color:var(--gold);background:rgba(242,181,68,.12)}
.radio[disabled]{opacity:.4;cursor:not-allowed}
.note{font-size:13px;color:var(--muted)}
.note a{color:var(--gold)}
/* lobby */
.lobby{display:grid;grid-template-columns:minmax(260px,380px) 1fr;gap:24px;align-items:start;max-width:1200px;width:100%;margin-inline:auto}
@media(max-width:900px){.lobby{grid-template-columns:1fr}}
.join{background:#fff;color:#141629;border-radius:var(--radius);padding:18px;text-align:center}
.join .code{font-size:clamp(46px,9vh,84px);font-weight:900;letter-spacing:.14em;line-height:1}
#qr{display:grid;place-items:center;margin:10px 0}
#qr img,#qr canvas{width:clamp(140px,30vh,230px)!important;height:auto!important}
.url{font-size:13px;word-break:break-all;color:#4b4f6b}
.side{display:grid;gap:12px}
.side h2{margin:0;font-size:22px}
.side h2 b{color:var(--gold)}
#plist{display:flex;flex-wrap:wrap;gap:6px;min-height:40px;max-height:clamp(70px,20vh,170px);overflow:auto;align-content:flex-start}
#plist span{background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-weight:700;font-size:15px;animation:pop .35s;cursor:pointer}
#plist span:hover{border-color:var(--red)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.rules{margin:0;padding-left:1.1em;display:grid;gap:4px;font-size:clamp(14px,2.1vh,17px)}
table.pk{border-collapse:collapse;width:100%;font-size:15px}
table.pk td{padding:5px 8px;border-bottom:1px solid var(--line)}
table.pk td:nth-child(2){color:var(--gold);font-weight:800;white-space:nowrap}
/* Timer vòng tròn dùng cho pha Cửa sau (backdoor) */
.timer{position:relative;width:clamp(62px,11vh,96px);aspect-ratio:1;flex:none}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer circle{fill:none;stroke-width:9}
.timer .bg{stroke:var(--line)}
.timer .fg{stroke:var(--gold);stroke-linecap:round}
.timer .num{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:clamp(22px,4vh,34px)}
.timer.low .fg{stroke:var(--red)}
.timer.low .num{color:var(--red)}
.timer.big{width:clamp(90px,16vh,140px)}

/* ===== BÀN ĐIỀU TRA: MÁY CHIẾU ===== */
body.desk{
  background:
    radial-gradient(120% 80% at 50% 0%, rgba(255,214,150,.10), transparent 60%),
    repeating-linear-gradient(92deg, rgba(255,255,255,.018) 0 2px, transparent 2px 11px),
    repeating-linear-gradient(88deg, rgba(0,0,0,.18) 0 1px, transparent 1px 23px),
    linear-gradient(180deg, var(--desk-2), var(--desk-0)) fixed;
  color:var(--cream);
  font-family:var(--f-ui);
}
body.desk #bar{background:rgba(0,0,0,.35);border-bottom:1px solid var(--desk-line)}
body.desk #bar .brand i{color:var(--brass)}
body.desk #bar .chip{border-color:var(--desk-line);color:var(--muted)}
body.desk #bar .chip b{color:var(--cream)}
body.desk #board{background:rgba(0,0,0,.35);border-top:1px solid var(--desk-line)}

.hmain{position:relative;width:100%;max-width:1320px;margin-inline:auto;display:flex;flex-direction:column;justify-content:center;gap:clamp(10px,1.8vh,20px);min-height:0}

/* Hồ sơ vụ việc */
.folder{position:relative;background:
    linear-gradient(180deg, rgba(255,255,255,.35), transparent 30%),
    repeating-linear-gradient(0deg, transparent 0 22px, rgba(90,70,40,.08) 22px 23px),
    linear-gradient(180deg,var(--paper),var(--paper-2));
  color:var(--ink);border-radius:8px;padding:clamp(14px,2.2vh,26px) clamp(18px,2.6vw,36px) clamp(10px,1.4vh,16px);transform:rotate(-.5deg);
  box-shadow:0 clamp(6px,.8vh,12px) clamp(16px,2vh,30px) rgba(0,0,0,.55), inset 0 0 0 1px rgba(0,0,0,.08);
  animation:folderSlide .3s ease-out;
}
@keyframes folderSlide{from{transform:translateY(-12px) rotate(-.5deg);opacity:0}to{transform:translateY(0) rotate(-.5deg);opacity:1}}
.folder .tab{position:absolute;top:clamp(-20px,-2.2vh,-15px);left:clamp(60px,7.5vw,96px);background:var(--paper-2);color:var(--ink-2);font-family:var(--f-mono);font-weight:700;
  font-size:clamp(11px,1.3vh,14px);letter-spacing:.14em;padding:clamp(3px,.5vh,5px) clamp(10px,1.2vw,16px) clamp(5px,.7vh,7px);border-radius:6px 6px 0 0;box-shadow:0 -2px 6px rgba(0,0,0,.25)}
.folder .clip{position:absolute;top:clamp(-12px,-1.4vh,-9px);right:clamp(70px,8vw,110px);width:clamp(14px,1.4vw,20px);height:clamp(36px,4.5vh,48px);border:clamp(2px,.3vw,4px) solid #9aa3ad;border-radius:8px;border-bottom-color:transparent;transform:rotate(8deg);opacity:.9}
.folder .mat{position:absolute;top:clamp(8px,1.2vh,14px);right:clamp(16px,2vw,28px);font-weight:900;font-size:clamp(11px,1.4vh,15px);letter-spacing:.2em;color:var(--stamp-red);
  border:clamp(2px,.25vw,3px) solid var(--stamp-red);border-radius:5px;padding:2px clamp(6px,.7vw,10px);transform:rotate(7deg);opacity:.75}
.folder .qtitle{margin:clamp(4px,.5vh,8px) 0 0;font-family:var(--f-doc);font-weight:700;font-size:clamp(19px,min(2.4vw,4vh),38px);line-height:1.24;max-width:90%;color:var(--ink)}
.folder .qmeta{display:flex;justify-content:space-between;align-items:center;margin-top:clamp(8px,1.1vh,14px);font-family:var(--f-mono);font-size:clamp(11px,1.3vh,14px);color:var(--ink-2)}
.folder .qmeta b{color:var(--ink);font-size:1.15em}
.slips{display:inline-flex;align-items:center;gap:8px}
.slips i{display:inline-block;width:14px;height:18px;background:#fff8e6;border:1px solid var(--paper-edge);box-shadow:2px 2px 0 #e7d9b6,4px 4px 0 #ddcda4}
.hint-btn{background:none;border:1px solid rgba(90,70,40,.3);border-radius:6px;font-family:var(--f-mono);font-size:clamp(11px,1.3vh,14px);font-weight:700;color:var(--ink-2);padding:3px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .15s ease}
.hint-btn:hover{border-color:var(--stamp-red);color:var(--ink);background:rgba(255,255,255,.4)}

/* Dây cháy chậm (đồng hồ) */
.fuse{position:absolute;left:clamp(54px,6.8vw,90px);right:clamp(70px,8vw,110px);top:clamp(7px,1vh,11px);height:clamp(5px,.65vh,8px);border-radius:99px;background:rgba(60,40,15,.18)}
.fuse .burn{position:absolute;inset:0 auto 0 0;width:calc(var(--p,1)*100%);border-radius:99px;background:linear-gradient(90deg,#8a6a2c,var(--brass) 60%,#f3c76a);transition:width .2s linear}
.fuse .spark{position:absolute;right:clamp(-8px,-1vh,-6px);top:50%;width:clamp(16px,2vh,22px);height:clamp(16px,2vh,22px);transform:translateY(-50%);border-radius:50%;background:radial-gradient(circle,#fff6c9 0 18%,#ffb43d 30%,rgba(255,120,30,.55) 50%,transparent 70%);animation:flick .18s infinite alternate}
@keyframes flick{to{transform:translateY(-50%) scale(1.25);filter:brightness(1.3)}}
.seal{position:absolute;left:clamp(10px,1.6vw,20px);top:clamp(-15px,-1.8vh,-10px);width:clamp(44px,min(4.8vw,7.6vh),68px);height:clamp(44px,min(4.8vw,7.6vh),68px);border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#f2c868,var(--brass) 45%,var(--brass-2));color:#2a1a04;font-family:var(--f-mono);font-weight:700;font-size:clamp(16px,min(1.8vw,3vh),26px);box-shadow:0 3px 8px rgba(0,0,0,.45), inset 0 0 0 3px rgba(255,255,255,.25)}
body.desk.low .fuse .burn{background:linear-gradient(90deg,#8a2c22,var(--stamp-red))}
body.desk.low .seal{background:radial-gradient(circle at 35% 30%,#f08070,var(--stamp-red) 50%,#7d1c16);color:#fff;animation:fuseShake .3s infinite alternate}
@keyframes fuseShake{from{transform:translate(0,0)}to{transform:translate(-1px,1px)}}

/* Thẻ tang vật (đáp án) */
.tags{display:grid;grid-template-columns:1fr 1fr;gap:clamp(8px,1.4vh,16px) clamp(14px,2.2vw,28px);padding:0 6px}
.tags .tag{position:relative;display:flex;align-items:stretch;min-height:clamp(52px,8.4vh,84px);background:linear-gradient(180deg,#fbf3df,var(--paper));color:var(--ink);border-radius:6px;transform:rotate(var(--r,0deg));box-shadow:0 5px 14px rgba(0,0,0,.5), inset 0 0 0 1px rgba(0,0,0,.07);transition:filter .25s, opacity .25s, transform .25s}
.tags .tag .band{flex:none;width:clamp(42px,min(5.4vw,8vh),72px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#fff;border-radius:6px 0 0 6px;position:relative}
.tags .tag .band .shape{font-size:clamp(18px,min(2vw,3vh),28px);line-height:1}
.tags .tag .band .letter{font-family:var(--f-mono);font-weight:700;font-size:clamp(11px,1.5vh,15px);opacity:.9}
.tags .tag .band .hole{position:absolute;top:clamp(5px,.7vh,8px);width:clamp(7px,.9vh,12px);height:clamp(7px,.9vh,12px);border-radius:50%;background:var(--desk-1);box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.t0 .band{background:var(--tag-a)} .t1 .band{background:var(--tag-b)} .t2 .band{background:var(--tag-c)} .t3 .band{background:var(--tag-d)}
.tags .tag .txt{flex:1;display:flex;align-items:center;padding:clamp(6px,1vh,12px) clamp(12px,1.5vw,20px);font-weight:700;font-size:clamp(15px,min(1.6vw,2.7vh),26px);line-height:1.25;color:var(--ink)}
.tags .tag .pin{position:absolute;top:clamp(-7px,-.8vh,-5px);left:50%;width:clamp(12px,1.4vh,18px);height:clamp(12px,1.4vh,18px);border-radius:50%;transform:translateX(-50%);background:radial-gradient(circle at 35% 30%,#ff9a8a,#b8261c 60%,#6e130d);box-shadow:0 2px 4px rgba(0,0,0,.5)}
.tags .tag .votes{display:none}
.tags .tag .verdict{display:none}

/* Trạng thái CÔNG BỐ ĐÁP ÁN (reveal) */
body.desk.revealed .fuse{display:none}
body.desk.revealed .seal{background:radial-gradient(circle at 35% 30%,#7fd3a0,var(--stamp-green) 55%,#16472c);color:#fff;font-size:clamp(10px,1.4vh,14px);letter-spacing:.05em}
body.desk.revealed .tags .tag:not(.ok){filter:grayscale(.9) brightness(.8);opacity:.55}
body.desk.revealed .tags .tag.ok{transform:rotate(0deg) scale(1.03);box-shadow:0 0 0 clamp(2px,.3vw,4px) var(--stamp-green),0 clamp(6px,.8vh,14px) clamp(16px,2vh,30px) rgba(0,0,0,.6)}
body.desk.revealed .tags .tag .votes{display:flex;position:absolute;left:clamp(42px,min(5.4vw,8vh),72px);right:0;bottom:0;height:clamp(16px,2.2vh,24px);align-items:center;gap:6px;padding:0 clamp(10px,1.4vw,18px);font-family:var(--f-mono);font-size:clamp(10px,1.3vh,13px);color:var(--ink-2);white-space:nowrap}
body.desk.revealed .tags .tag .votes i{display:block;height:clamp(4px,.5vh,6px);border-radius:99px;background:currentColor;opacity:.55}
body.desk.revealed .tags .tag .txt{padding-bottom:clamp(18px,2.6vh,28px)}
body.desk.revealed .tags .tag.ok .verdict{display:block;position:absolute;right:clamp(10px,1.4vw,20px);top:clamp(-16px,-1.8vh,-10px);font-weight:900;font-size:clamp(15px,min(1.5vw,2.5vh),22px);letter-spacing:.12em;color:var(--stamp-green);border:clamp(2px,.3vw,4px) solid var(--stamp-green);border-radius:6px;padding:2px clamp(8px,1vw,14px);background:rgba(241,230,201,.95);transform:rotate(-8deg);animation:stampIn .38s cubic-bezier(.2,1.4,.4,1) .25s both}
@keyframes stampIn{from{transform:rotate(-18deg) scale(2.1);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}

/* Biên bản kết luận */
.hmain .note{display:none;background:var(--cream);color:var(--ink);border-left:clamp(5px,.6vw,8px) solid var(--stamp-red);border-radius:6px;padding:clamp(8px,1.2vh,14px) clamp(14px,1.8vw,22px);font-size:clamp(13px,min(1.4vw,2.2vh),18px);line-height:1.35;box-shadow:0 clamp(4px,.5vh,8px) clamp(10px,1.5vh,20px) rgba(0,0,0,.45);transform:rotate(.25deg)}
.hmain .note h4{margin:0 0 3px;font-family:var(--f-mono);font-size:clamp(11px,1.4vh,15px);letter-spacing:.16em;color:var(--stamp-red)}
.hmain .note small{display:block;margin-top:3px;font-family:var(--f-mono);font-size:clamp(10px,1.2vh,13px);color:var(--ink-2)}
body.desk.revealed .hmain .note{display:block;animation:slideUp .35s ease-out .55s both}
@keyframes slideUp{from{transform:translateY(10px) rotate(.25deg);opacity:0}to{transform:translateY(0) rotate(.25deg);opacity:1}}

/* Bảng tin (pinnote) */
.pinnote{background:var(--cream);color:var(--ink);border-radius:5px;padding:clamp(3px,.5vh,6px) clamp(8px,1vw,14px);min-width:clamp(80px,9vw,120px);text-align:center;transform:rotate(var(--r,0deg));box-shadow:0 3px 7px rgba(0,0,0,.5)}
.pinnote .n{font-size:clamp(10px,1.3vh,13px);font-weight:700;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pinnote .s{font-family:var(--f-mono);font-weight:700;font-size:clamp(16px,2.2vh,24px)}
.pinnote.cnt{background:transparent;color:var(--cream);box-shadow:none;border:1px dashed var(--desk-line)}
.pinnote.cnt .n{color:var(--muted)}

@media (prefers-reduced-motion: reduce){
  *{animation:none !important;transition:none !important}
  .tag,.folder,.hmain .note,.pinnote{transform:none !important}
  .seal{animation:none !important}
}
/* backdoor / inspection */
body.night{background:radial-gradient(1000px 620px at 50% 0%,#521126 0%,#13070d 70%) fixed}
body.siren{background:radial-gradient(1000px 620px at 50% 0%,#0d3363 0%,#070b16 70%) fixed}
.center{text-align:center;display:grid;gap:clamp(8px,1.8vh,16px);justify-items:center}
.center h1{font-size:clamp(32px,6.5vh,66px);letter-spacing:.05em;margin:0;line-height:1.05}
.center p{margin:0;font-size:clamp(16px,2.6vh,22px);max-width:42em}
.env{width:clamp(70px,13vh,130px);animation:float 2.4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px) rotate(-3deg)}}
.bdhead{display:flex;align-items:center;gap:clamp(16px,3vw,40px)}
.perks{display:grid;grid-template-columns:repeat(3,minmax(0,250px));gap:12px;justify-content:center}
@media(max-width:800px){.perks{grid-template-columns:1fr}}
.perk{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:12px 14px;text-align:left}
.perk b{font-size:20px;display:block}
.perk .p{color:var(--gold);font-weight:900;font-size:20px}
.perk span{color:var(--muted);font-size:14px}
.big-num{font-size:clamp(48px,11vh,110px);font-weight:900;line-height:1}
.report{max-width:920px;width:100%;margin:0 auto;display:grid;gap:8px}
.row{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-size:clamp(15px,2.4vh,19px);text-align:left}
.row.caught{border-color:var(--red);background:rgba(229,72,77,.12)}
.row .r{margin-left:auto;font-weight:900;white-space:nowrap}
.tag{font-size:12px;font-weight:800;border-radius:6px;padding:2px 8px;background:var(--red);color:#fff;white-space:nowrap;display:inline-block}
.tag.ok{background:var(--green)}
.tag.gray{background:var(--line)}
.tag.gold{background:var(--gold);color:#271a03}
.stamp{display:inline-block;border:4px solid var(--red);color:var(--red);border-radius:10px;padding:2px 14px;font-weight:900;letter-spacing:.12em;transform:rotate(-5deg);font-size:clamp(16px,2.6vh,22px)}
.stamp.ok{border-color:var(--green);color:var(--green)}
/* end */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:16px}
.pod{width:clamp(120px,18vw,240px);text-align:center;display:grid;gap:6px}
.pod .nm{font-weight:900;font-size:clamp(16px,2.6vh,22px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .bar{border-radius:14px 14px 0 0;display:grid;place-items:center;font-size:clamp(22px,4vh,32px);font-weight:900;color:#271a03}
.pod.p1 .bar{height:clamp(70px,14vh,130px);background:linear-gradient(#ffd77a,#e9a720)}
.pod.p2 .bar{height:clamp(52px,10vh,96px);background:linear-gradient(#eef1f7,#aab4c8)}
.pod.p3 .bar{height:clamp(40px,7.5vh,72px);background:linear-gradient(#f3c49b,#c4844f)}
.center h1.sm{font-size:clamp(24px,4.6vh,44px)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:6px;max-width:980px;width:100%}
.cgrid .row{padding:6px 12px;font-size:clamp(13px,2vh,16px);gap:8px;flex-wrap:wrap}
.stats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 22px;text-align:center;min-width:150px}
.stat b{display:block;font-size:clamp(28px,5vh,42px);line-height:1.1}
.stat span{color:var(--muted);font-size:14px}

<body>
<div id="app">
  <header id="bar">
    <div class="brand">LIÊM <i>hay</i> LÁCH?</div>
    <div id="barInfo"></div>
    <div id="trustWrap"></div>
    <div class="tools">
      <button class="danger" data-act="endnow" id="endBtn" hidden title="Kết thúc ván ngay và chuyển sang bảng thành tích">Kết thúc ngay</button>
      <button data-act="mute" id="muteBtn" title="Phím M">Âm thanh: bật</button>
      <button data-act="fs" title="Phím F">Toàn màn hình</button>
    </div>
  </header>
  <main id="main" aria-live="polite"></main>
  <footer id="board"></footer>
</div>
<script>
(function(){
"use strict";
const { CONFIG: C, PERKS, esc, uid, roomCode, openStore, sfx, signed } = window.LHL;

/* Câu hỏi: t = đề, o = 4 đáp án, a = đáp án đúng (0-3), e = giải thích, s = căn cứ */
const QUESTIONS = [
  { t: "Theo Luật Phòng, chống tham nhũng 2018, tham nhũng là hành vi của người có chức vụ, quyền hạn đã lợi dụng chức vụ, quyền hạn đó…",
    o: ["vì vụ lợi", "gây thiệt hại trên 100 triệu đồng", "để giúp người thân", "khi làm việc trong cơ quan nhà nước"], a: 0,
    e: "Phải có cùng lúc hai yếu tố: có chức vụ, quyền hạn và lợi dụng nó vì vụ lợi. Luật không đặt ngưỡng số tiền.", s: "Luật PCTN 2018, khoản 1 Điều 3" },
  { t: "Tình huống nào KHÔNG phải là tham nhũng?",
    o: ["Cán bộ nhận \"phong bì\" mới giải quyết hồ sơ", "Giám đốc sở nhận tiền rồi giao đất không qua đấu giá", "Cán bộ quyết định sai vì thiếu năng lực, không nhận lợi ích gì", "Trưởng phòng mua hàng nhận \"hoa hồng\" để chọn giá cao"], a: 2,
    e: "Thiếu yếu tố vụ lợi: đây là vi phạm, gây lãng phí và vẫn phải chịu trách nhiệm, nhưng chưa phải tham nhũng.", s: "Luật PCTN 2018, Điều 3" },
  { t: "Năm 1994, Hội nghị đại biểu toàn quốc giữa nhiệm kỳ khóa VII xác định \"nạn tham nhũng và tệ quan liêu\" là…",
    o: ["một trong bốn nguy cơ", "nhiệm vụ trọng tâm duy nhất", "hiện tượng nhất thời", "vấn đề riêng của khu vực tư nhân"], a: 0,
    e: "Dấu mốc Đảng thẳng thắn chỉ ra một nguy cơ nội tại có thể ảnh hưởng tới sự tồn vong của chế độ.", s: "Lê Văn Lợi, Tạp chí Lịch sử Đảng, số 6-2025" },
  { t: "Hai văn bản quy định mâu thuẫn nhau về điều kiện giao đất, mỗi nơi hiểu một kiểu. Đây là hạn chế thuộc nhóm nào?",
    o: ["Chính sách, pháp luật", "Phát hiện, xử lý", "Tuyên truyền, phổ biến", "Bổ nhiệm cán bộ"], a: 0,
    e: "Pháp luật chồng chéo, mâu thuẫn, thiếu minh bạch tạo khoảng trống để áp dụng tùy tiện.", s: "Slide Session 29: hạn chế về pháp luật" },
  { t: "Người dân biết sai phạm nhưng không dám tố cáo vì sợ bị trả thù. Đây là hạn chế trong…",
    o: ["Quản lý, điều hành kinh tế", "Phát hiện và xử lý tham nhũng", "Tuyên truyền, phổ biến", "Chính sách, pháp luật"], a: 1,
    e: "Thiếu cơ chế khuyến khích, bảo vệ người tố giác làm tham nhũng khó bị phát hiện.", s: "Slide Session 29: hạn chế trong phát hiện và xử lý" },
  { t: "\"Nhân dân giảm sút lòng tin vào sự lãnh đạo của Đảng và sự quản lý của Nhà nước\" là tác hại về mặt nào?",
    o: ["Kinh tế", "Chính trị", "Xã hội", "Môi trường"], a: 1,
    e: "Đây là tác hại chính trị. Văn kiện Đảng coi tham nhũng là một nguy cơ đe dọa sự tồn vong của Đảng và chế độ.", s: "Văn kiện Đảng; slide Session 29" },
  { t: "Ban Chỉ đạo Trung ương về phòng, chống tham nhũng (thành lập đầu năm 2013) do ai làm Trưởng ban?",
    o: ["Thủ tướng Chính phủ", "Chủ tịch Quốc hội", "Tổng Bí thư", "Tổng Thanh tra Chính phủ"], a: 2,
    e: "Ban Chỉ đạo trực thuộc Bộ Chính trị, do Tổng Bí thư làm Trưởng ban.", s: "Quyết định 162-QĐ/TW (1/2/2013)" },
  { t: "\"Xử lý vi phạm không có vùng cấm, không có ngoại lệ\" nhằm để cán bộ…",
    o: ["Không thể tham nhũng", "Không dám tham nhũng", "Không muốn tham nhũng", "Không cần tham nhũng"], a: 1,
    e: "Xử lý nghiêm minh tạo sức răn đe: không dám. Bốn chữ KHÔNG bổ trợ cho nhau.", s: "Chỉ thị 42-CT/TW (16/1/2025)" },
  { t: "Luật PCTN 2018 mở rộng phòng, chống tham nhũng sang khu vực nào?",
    o: ["Khu vực ngoài nhà nước", "Chỉ lực lượng vũ trang", "Chỉ chính quyền cấp xã", "Các tổ chức quốc tế"], a: 0,
    e: "Doanh nghiệp, tổ chức ngoài nhà nước cũng có thể có tham ô, nhận hối lộ, đưa và môi giới hối lộ.", s: "Kết luận 10-KL/TW (2017); Luật PCTN 2018" },
  { t: "Trong nhiệm kỳ Đại hội XIII, bao nhiêu cán bộ diện Trung ương quản lý bị xử lý kỷ luật?",
    o: ["74", "174", "274", "1.740"], a: 1,
    e: "174 cán bộ bị kỷ luật, trong đó 66 người bị xử lý hình sự.", s: "Hội nghị tổng kết nhiệm kỳ XIII, 11/12/2025" },
  { t: "Nâng cao đời sống cho cán bộ, công chức, viên chức nhằm để họ…",
    o: ["Không thể tham nhũng", "Không dám tham nhũng", "Không muốn tham nhũng", "Không cần tham nhũng"], a: 3,
    e: "Đời sống được bảo đảm thì giảm động cơ tham nhũng để bù đắp.", s: "Chỉ thị 42-CT/TW (16/1/2025)" },
  { t: "Chỉ số cảm nhận tham nhũng (CPI) 2025 chấm Việt Nam bao nhiêu điểm trên thang 100?",
    o: ["31", "41", "51", "61"], a: 1,
    e: "Việt Nam đạt 41/100, xếp 81/182. Năm 2012 là 31 điểm: có tiến bộ nhưng còn nhiều việc phải làm.", s: "Transparency International, 10/2/2026" }
];
const ORDERS = { 8: [0, 1, 2, 3, 4, 5, 6, 7], 12: [0, 1, 8, 2, 3, 4, 5, 9, 6, 7, 10, 11] };
const PLAN = { 8: { inspect: [2, 5, 7], act2: 4 }, 12: { inspect: [2, 5, 8, 11], act2: 6 } };
const SHAPES = ["▲", "◆", "●", "■"];
const SAVE_KEY = "lhl-host-save-v2";
const qp = new URLSearchParams(location.search);
const $ = s => document.querySelector(s);
const hasFb = !!(window.FIREBASE_CONFIG && window.FIREBASE_CONFIG.databaseURL);

let H = null;                       // trạng thái ván chơi (lưu được)
if (qp.get("debug") === "1") window.__lhl = { get H() { return H; } };
const R = { store: null, unsub: {}, conn: true, lastSec: -1 };
const SET = {
  mode: qp.get("mode") === "local" || !hasFb ? "local" : "firebase",
  n: qp.get("n") === "12" ? 12 : 8,
  qTime: +(qp.get("t") || C.questionTime)
};
const LIVE = ["question", "reveal", "backdoor", "bdsum", "inspect", "inspres", "act"];

/* ---------- tiện ích ---------- */
const now = () => (R.store ? R.store.now() : Date.now());
const pids = () => Object.keys(H.players).sort((a, b) => H.players[a].at - H.players[b].at);
const nameOf = id => (H.players[id] ? H.players[id].name : "?");
const curQ = () => QUESTIONS[H.order[H.qi]];
let _sc = null;
function scores() { if (_sc) return _sc; const m = {}; for (const e of H.events) m[e.p] = (m[e.p] || 0) + e.d; return (_sc = m); }
const score = id => scores()[id] || 0;
function ev(p, d, tag, why) { if (d) { H.events.push({ p, d, tag, why }); _sc = null; } }
function unev(tag) { H.events = H.events.filter(e => e.tag !== tag); _sc = null; }
const nTrust = () => Math.max(H.nStart || pids().length, 4);
const perBribe = () => C.trustBribeK / nTrust();
const perCatch = () => C.trustCatchK / nTrust();
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(H)); } catch (e) {} }
function stopSub(k) { if (R.unsub[k]) { try { R.unsub[k](); } catch (e) {} R.unsub[k] = null; } }
function stopAll() { Object.keys(R.unsub).forEach(stopSub); }
function fresh(mode, room) {
  return { v: 2, mode, room, n: SET.n, order: ORDERS[SET.n], qTime: SET.qTime, bdTime: C.backdoorTime,
    phase: "lobby", qi: -1, act: 1, trust: 100, nStart: 0, startAt: 0, endsAt: 0, early: false,
    players: {}, kicked: {}, events: [], ledger: [], answers: {}, results: {}, mult: {}, bribesNow: {},
    reports: {}, inspectNo: 0, inspectedAfter: -1, lastInspect: null, lastBd: null, rep: {},
    endStep: 0, showAll: false, final: null };
}
function joinURL() {
  return new URL("index.html?room=" + H.room + (H.mode === "local" ? "&mode=local" : ""), location.href).href;
}
function uniqueName(n) {
  const taken = new Set(Object.values(H.players).map(p => p.name.toLowerCase()));
  if (!taken.has(n.toLowerCase())) return n;
  for (let k = 2; k < 100; k++) { const c = n.slice(0, 16) + " (" + k + ")"; if (!taken.has(c.toLowerCase())) return c; }
  return n;
}

/* ---------- đồng bộ với điện thoại ---------- */
function pubState() {
  const q = (H.phase === "question" || H.phase === "reveal") ? curQ() : null;
  R.store.set("state", {
    phase: H.phase, qi: H.qi, total: H.order.length, act: H.act, trust: Math.round(H.trust), endsAt: H.endsAt,
    n: pids().length,
    q: q ? { t: q.t, o: q.o } : null,
    reveal: H.phase === "reveal" ? { a: q.a, e: q.e } : null,
    insp: H.phase === "inspres" ? H.lastInspect : null,
    final: H.phase === "end" && H.final ? { trust: H.final.trust, trustFail: H.final.trustFail, total: H.final.total, caught: H.final.caught, cleanN: H.final.cleanN, n: H.final.n } : null,
    rate: C.detectRate[H.act - 1], ts: now()
  });
  save();
}
function pubBoard() {
  const b = {}, sc = scores();
  pids().forEach(id => { b[id] = { name: H.players[id].name, score: sc[id] || 0 }; });
  R.store.set("board", b);
}
function note(id, text, tone) { R.store.update("private/" + id, { note: { at: now(), text, tone: tone || "info" } }); }
function subscribeCore() {
  stopSub("players"); stopSub("reports");
  R.unsub.players = R.store.on("players", v => {
    v = v || {}; let changed = false;
    for (const id in v) {
      if (!H.players[id] && v[id] && !H.kicked[id]) {
        H.players[id] = { name: uniqueName(String(v[id].name || "Người chơi").slice(0, 20)), at: v[id].at || now() };
        ev(id, C.startScore, "start", "Vốn ban đầu"); changed = true;
      }
    }
    if (changed) {
      pubBoard(); save();
      if (H.phase === "lobby") { if (!paintPlayers()) render(); paintBar(); } else { paintBoard(); paintBar(); }
    }
  });
  R.unsub.reports = R.store.on("reports", v => {
    H.reports = v || {}; save();
    if (H.phase === "inspect") { const el = $("#repN"); if (el) el.textContent = Object.keys(H.reports).length; }
  });
}

/* ---------- các pha của ván chơi ---------- */
function startGame() {
  if (!pids().length) return;
  H.nStart = pids().length; H.qi = 0; goQuestion();
}

function goQuestion() {
  H.phase = "question"; H.early = false;
  H.startAt = now(); H.endsAt = H.startAt + H.qTime * 1000;
  H.answers[H.qi] = H.answers[H.qi] || {};
  const qi = H.qi; stopSub("ans");
  R.unsub.ans = R.store.on("answers/" + qi, v => {
    if (H.phase !== "question" || H.qi !== qi) return;
    H.answers[qi] = v || {};
    const ids = pids(), n = ids.filter(id => H.answers[qi][id]).length;
    const el = $("#ansCount"); if (el) el.textContent = n + "/" + ids.length;
    if (ids.length && n >= ids.length && !H.early) { H.early = true; H.endsAt = Math.min(H.endsAt, now() + 1200); }
  });
  R.lastSec = -1; pubState(); render();
}

function goReveal() {
  if (H.phase !== "question") return;
  stopSub("ans"); H.phase = "reveal";
  scoreQuestion(H.qi); pubState(); pubBoard(); render(); sfx.good();
}

function scoreQuestion(qi) {
  const q = QUESTIONS[H.order[qi]], ans = H.answers[qi] || {}, res = {};
  const limit = H.startAt + H.qTime * 1000 + 1500;
  unev("q:" + qi);
  pids().forEach(id => {
    const a = ans[id];
    let ok = !!a && a.c === q.a;
    if (ok && a.at && a.at > limit) ok = false;
    let pts = 0;
    if (ok) {
      const sp = a.at ? Math.max(0, Math.min(1, 1 - (a.at - H.startAt) / (H.qTime * 1000))) : 0;
      pts = Math.round(C.basePoints + C.speedBonus * sp);
      if (H.mult[qi] && H.mult[qi][id]) pts *= 2;
      ev(id, pts, "q:" + qi, "Đúng câu " + (qi + 1));
    }
    res[id] = { ok, pts, c: a ? a.c : -1 };
  });
  H.results[qi] = res;
  H.ledger.forEach(L => { if (L.q === qi && (L.perk === "lode" || L.perk === "chay")) L.gain = res[L.p] ? res[L.p].pts : 0; });
  R.store.set("results/" + qi, res);
}

function afterQuestion() {
  const plan = PLAN[H.n];
  if (plan.inspect.includes(H.qi) && H.inspectedAfter !== H.qi) return goInspect();
  if (H.act === 1 && H.qi + 1 === plan.act2) { H.act = 2; H.phase = "act"; pubState(); render(); sfx.siren(); return; }
  if (H.qi + 1 < H.order.length) { H.qi++; return goBackdoor(); }
  goEnd();
}

function goBackdoor() {
  H.phase = "backdoor"; H.bribesNow = {}; H.early = false;
  H.endsAt = now() + H.bdTime * 1000; H.mult[H.qi] = H.mult[H.qi] || {};
  const qi = H.qi; stopSub("br");
  R.unsub.br = R.store.on("bribes/" + qi, v => {
    if (H.phase !== "backdoor" || H.qi !== qi) return;
    H.bribesNow = v || {};
    const ids = pids(), n = ids.filter(id => H.bribesNow[id]).length;
    const el = $("#bdCount"); if (el) el.textContent = n + "/" + ids.length;
    if (ids.length && n >= ids.length && !H.early) { H.early = true; H.endsAt = Math.min(H.endsAt, now() + 1200); }
  });
  R.lastSec = -1; pubState(); render(); sfx.coin();
}

function processBackdoor() {
  if (H.phase !== "backdoor") return;
  stopSub("br");
  const qi = H.qi, q = curQ(); let count = 0;
  pids().forEach(id => {
    const b = H.bribesNow[id]; if (!b || !PERKS[b.perk]) return;
    const P = PERKS[b.perk];
    if (score(id) < P.price) { note(id, "Không đủ điểm, phong bì bị trả lại.", "warn"); return; }
    let fixQ = null;
    if (b.perk === "xoa") {
      for (let j = qi - 1; j >= 0; j--) { const r = H.results[j] && H.results[j][id]; if (r && !r.ok) { fixQ = j; break; } }
      if (fixQ === null) { note(id, "Bạn chưa sai câu nào, phong bì bị trả lại.", "warn"); return; }
    }
    const L = { id: uid(6), p: id, perk: b.perk, q: qi, cost: P.price, gain: 0, rolled: false, caught: false, fixQ };
    ev(id, -P.price, "cost:" + L.id, "Phong bì " + P.name);
    if (b.perk === "lode") {
      const wrong = q.o.map((_, i) => i).filter(i => i !== q.a);
      const keep = [q.a, wrong[Math.floor(Math.random() * wrong.length)]].sort((x, y) => x - y);
      R.store.update("private/" + id, { elim: { qi, keep } });
    }
    if (b.perk === "chay") H.mult[qi][id] = true;
    if (b.perk === "xoa") {
      const r = H.results[fixQ][id];
      H.results[fixQ][id] = { ok: true, pts: C.basePoints, c: r.c, fixed: true };
      ev(id, C.basePoints, "fix:" + L.id, "Xóa án câu " + (fixQ + 1)); L.gain = C.basePoints;
      R.store.set("results/" + fixQ + "/" + id, H.results[fixQ][id]);
    }
    H.ledger.push(L); count++;
    H.trust = Math.max(0, H.trust - perBribe());
    note(id, "Đã trao phong bì " + P.name + " (−" + P.price + " điểm). Coi chừng thanh tra!", "bribe");
  });
  H.lastBd = { qi, count }; H.phase = "bdsum";
  pubState(); pubBoard(); render(); if (count) sfx.coin();
}

function goInspect() { H.phase = "inspect"; pubState(); render(); sfx.siren(); }

function catchL(L, by, no) {
  L.caught = true; L.by = by; L.caughtAt = no;
  L.claw = Math.max(0, L.gain || 0); L.fine = C.fineMultiplier * L.cost;
  ev(L.p, -L.claw, "claw:" + L.id, "Thu hồi lợi ích");
  ev(L.p, -L.fine, "fine:" + L.id, "Phạt phong bì");
  H.trust = Math.min(100, H.trust + perCatch());
}

function runInspect() {
  if (H.phase !== "inspect") return;
  const no = H.inspectNo + 1, rate = C.detectRate[H.act - 1], caught = [], repRes = [], rewarded = {};
  const reps = Object.entries(H.reports || {})
    .filter(([from, r]) => H.players[from] && r && H.players[r.target] && r.target !== from)
    .sort((a, b) => (a[1].at || 0) - (b[1].at || 0));
  reps.forEach(([from, r]) => {
    const ok = H.ledger.some(L => L.p === r.target && (!L.caught || L.caughtAt === no));
    H.ledger.forEach(L => { if (L.p === r.target && !L.caught) { catchL(L, "tố giác", no); caught.push(L); } });
    let d = 0, capped = false;
    if (ok) {
      rewarded[r.target] = (rewarded[r.target] || 0) + 1;
      if (rewarded[r.target] <= C.reportCap) d = C.reportReward[H.act - 1]; else capped = true;
    } else d = -C.reportFalsePenalty;
    ev(from, d, "rep:" + no + ":" + from, ok ? "Tố giác đúng" : "Tố giác sai");
    H.rep[from] = H.rep[from] || { ok: 0, bad: 0 };
    if (ok) H.rep[from].ok++; else H.rep[from].bad++;
    repRes.push({ from, target: r.target, ok, d, capped });
  });
  H.ledger.forEach(L => {
    if (L.caught || L.rolled) return;
    const prior = H.ledger.filter(x => x.p === L.p && x.rolled).length;   // càng tham càng dễ lộ
    L.rolled = true;
    if (Math.random() < Math.min(C.detectMax, rate + C.repeatStep * prior)) { catchL(L, "thanh tra", no); caught.push(L); }
  });
  Object.keys(H.reports || {}).forEach(k => R.store.remove("reports/" + k));
  H.reports = {};
  H.inspectNo = no; H.inspectedAfter = H.qi;
  H.lastInspect = { no, rate, repN: reps.length, repOk: repRes.filter(r => r.ok).length,
    caught: caught.map(L => ({ p: L.p, name: nameOf(L.p), perk: L.perk, q: L.q, claw: L.claw, fine: L.fine, by: L.by })) };
  H.phase = "inspres";
  caught.forEach(L => note(L.p, "Bị phát hiện phong bì " + PERKS[L.perk].name + ": thu hồi " + L.claw + ", phạt " + L.fine + " điểm.", "caught"));
  repRes.forEach(r => R.store.update("private/" + r.from, { repResult: { no, target: nameOf(r.target), ok: r.ok, d: r.d, capped: r.capped } }));
  pubState(); pubBoard(); render();
  if (caught.length) sfx.bad(); else sfx.good();
}

function goEnd() {
  stopSub("ans"); stopSub("br"); stopSub("reports");
  if (!H.final) {
    const ids = pids(), trustFail = H.trust < C.trustLimit;
    if (trustFail) ids.forEach(id => ev(id, -Math.round(Math.max(0, score(id)) * C.trustPenaltyRate), "end:trust", "Niềm tin sụp đổ"));
    const clean = ids.filter(id => !H.ledger.some(L => L.p === id));
    clean.forEach(id => ev(id, C.cleanBonus, "end:clean", "Liêm chính"));
    const qDone = Object.keys(H.results).length;
    const rows = ids.map(id => {
      const mine = H.ledger.filter(L => L.p === id), rp = H.rep[id] || { ok: 0, bad: 0 };
      const correct = Object.values(H.results).filter(r => r[id] && r[id].ok).length;
      return { id, name: nameOf(id), score: score(id), correct, bribes: mine.length, caught: mine.filter(L => L.caught).length,
        repOk: rp.ok, repBad: rp.bad, clean: clean.includes(id) };
    }).sort((a, b) => b.score - a.score || b.correct - a.correct || a.name.localeCompare(b.name));
    rows.forEach((r, i) => { r.rank = i && rows[i - 1].score === r.score ? rows[i - 1].rank : i + 1; });
    H.final = { trust: Math.round(H.trust), trustFail, qDone, n: ids.length, cleanN: clean.length, rows,
      total: H.ledger.length, caught: H.ledger.filter(L => L.caught).length,
      byPerk: Object.keys(PERKS).map(k => ({ k, n: H.ledger.filter(L => L.perk === k).length })) };
    rows.forEach(r => R.store.update("private/" + r.id, { final: { rank: r.rank, of: rows.length, score: r.score, correct: r.correct, qDone,
      bribes: r.bribes, caught: r.caught, repOk: r.repOk, repBad: r.repBad, clean: r.clean } }));
  }
  H.phase = "end"; H.endStep = 0; H.showAll = false; pubState(); pubBoard(); render(); sfx.fanfare(); setTimeout(confetti, 300);
}

async function closeSession() {
  if (!H || H.phase !== "end") return;
  stopAll(); H.phase = "closed";
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
  await R.store.set("state", { phase: "closed", ts: now() });
  render();
  // dọn dữ liệu của phòng (người chơi đã nhận kết quả của mình)
  setTimeout(() => { ["players", "board", "answers", "bribes", "results", "private", "reports"].forEach(p => R.store.remove(p)); }, 4000);
}

function primary() {
  if (!H) return;
  switch (H.phase) {
    case "lobby": return startGame();
    case "question": return goReveal();
    case "reveal": return afterQuestion();
    case "backdoor": return processBackdoor();
    case "bdsum": return goQuestion();
    case "inspect": return runInspect();
    case "inspres": case "act": return afterQuestion();
    case "end": if (H.endStep < 2) { H.endStep++; save(); render(); } return;
  }
}

/* ---------- tạo phòng / tiếp tục ---------- */
function bindConn() { R.store.onConnection(c => { R.conn = c; paintBar(); }); }
async function createRoom() {
  sfx.unlock();
  const room = (qp.get("room") || roomCode()).toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8) || roomCode();
  try { R.store = await openStore(SET.mode, room); }
  catch (e) { alert("Không mở được kết nối: " + e.message); return; }
  await R.store.reset();
  H = fresh(SET.mode, room);
  bindConn(); subscribeCore(); pubState(); pubBoard(); render();
}
async function resume() {
  let saved = null; try { saved = JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) {}
  if (!saved || saved.v !== 2) return;
  sfx.unlock();
  try { R.store = await openStore(saved.mode, saved.room); }
  catch (e) { alert("Không mở được kết nối: " + e.message); return; }
  H = saved; _sc = null;
  bindConn(); subscribeCore();
  if (H.phase === "question") goQuestion();
  else if (H.phase === "backdoor") goBackdoor();
  else { pubState(); pubBoard(); render(); }
}

function timerHTML(big) {

  }
  return `<div class="fuse" aria-hidden="true"><div class="burn" id="burn"><i class="spark"></i></div></div><div class="seal" id="seal" role="timer" aria-label="Thời gian còn lại">–</div>`;
}
function paintTimer(rem, total) {
  const seal = $("#seal"), burn = $("#burn");
  if (seal && burn) {
    if (H && H.phase === "reveal") {
      seal.textContent = "ĐÃ CHỐT";
    } else {
      const ratio = Math.max(0, Math.min(1, rem / (total * 1000)));
      burn.style.setProperty("--p", ratio);
      const sec = Math.ceil(rem / 1000);
      seal.textContent = sec;
      document.body.classList.toggle("low", sec <= 5);
    }
  }
  const el = $("#timer");
  if (el) {
    const ratio = Math.max(0, Math.min(1, rem / (total * 1000)));
    const fg = el.querySelector(".fg");
    if (fg) fg.style.strokeDashoffset = (276.46 * (1 - ratio)).toFixed(1);
    const sec = Math.ceil(rem / 1000);
    const num = el.querySelector(".num");
    if (num) num.textContent = sec;
    el.classList.toggle("low", sec <= 5);
  }
}

  return `<div class="center">
    <div class="stamp">Thanh tra</div>
    <h1>THANH TRA CHUẨN BỊ VÀO CUỘC</h1>
    <p>Màn ${H.act}: mỗi phong bì chưa bị kiểm tra có <b>${Math.round(C.detectRate[H.act - 1] * 100)}%</b> khả năng bị phát hiện, cộng thêm ${C.repeatStep * 100}% cho mỗi phong bì người đó đã đưa trước đó.</p>
    <p>Bạn nghi ai đã đưa phong bì? Đây là lúc <b>tố giác</b> trên điện thoại (mỗi đợt 1 lần). Đơn đã nhận: <b id="repN">${Object.keys(H.reports || {}).length}</b></p>
    <div class="ctrl"><button class="btn red" data-act="primary">Thanh tra vào cuộc <span class="kbd">Space</span></button></div></div>`;
}
function inspresHTML() {
  const I = H.lastInspect || { caught: [], repN: 0, repOk: 0 };
  const shown = I.caught.slice(0, 8);
  const rows = shown.map(c => `<div class="row caught"><span class="tag">${c.by === "tố giác" ? "Bị tố giác" : "Thanh tra"}</span>
      <b>${esc(c.name)}</b><span>${esc(PERKS[c.perk].name)} · câu ${c.q + 1}</span>
      <span class="r">−${c.claw + c.fine}</span></div>`).join("");
  const more = I.caught.length > shown.length ? `<div class="muted">… và ${I.caught.length - shown.length} người khác</div>` : "";
  const none = !I.caught.length ? `<p>Không phát hiện phong bì nào. Hoặc cả lớp trong sạch, hoặc… chưa bị phát hiện.</p>` : "";
  const rep = I.repN ? `<div class="row"><span class="tag ${I.repOk ? "ok" : "gray"}">Tố giác</span><span>${I.repN} đơn tố giác, <b>${I.repOk}</b> đơn đúng</span></div>` : "";
  return `<div class="center"><div class="stamp ${I.caught.length ? "" : "ok"}">${I.caught.length ? "Có sai phạm" : "Chưa phát hiện"}</div>
    <h1 class="sm">BIÊN BẢN THANH TRA SỐ ${I.no || 1}</h1>${none}
    <div class="cgrid">${rows}</div>${more}<div class="report">${rep}</div>
    ${I.caught.length ? `<p class="muted">Bị phát hiện: thu hồi toàn bộ điểm có được nhờ phong bì và phạt gấp ${C.fineMultiplier} số đã đưa. Mỗi vụ bị xử lý giúp niềm tin của lớp hồi lại.</p>` : ""}
    ${trustHTML(H.trust, true)}
    <div class="ctrl"><button class="btn" data-act="primary">Tiếp tục <span class="kbd">Space</span></button></div></div>`;
}
function actHTML() {
  return `<div class="center"><div class="stamp">Màn 2</div><h1>SIẾT KỶ LUẬT</h1>
    <div class="report">
      <div class="row"><span class="tag">Thanh tra</span><span>Xác suất phát hiện mỗi phong bì tăng từ ${C.detectRate[0] * 100}% lên <b>${C.detectRate[1] * 100}%</b></span></div>
      <div class="row"><span class="tag ok">Tố giác</span><span>Tố giác đúng được thưởng <b>+${C.reportReward[1]}</b></span></div>
      <div class="row"><span class="tag gray">Hỏi cả lớp</span><span>Giờ còn ai <b>dám</b> đưa phong bì không?</span></div>
    </div>
    <p class="muted">Xử lý nghiêm, không có vùng cấm để cán bộ "không dám" tham nhũng.</p>
    <div class="ctrl"><button class="btn" data-act="primary">Tiếp tục <span class="kbd">Space</span></button></div></div>`;
}
function endHTML() {
  const F = H.final;
  if (H.endStep === 0) {
    const cleanRows = F.rows.filter(r => r.clean), names = cleanRows.slice(0, 10).map(r => esc(r.name)).join(", ");
    return `<div class="center"><h1>TỔNG KẾT</h1>${trustHTML(F.trust, true)}
      <div class="report">
        <div class="row ${F.trustFail ? "caught" : ""}"><span class="tag ${F.trustFail ? "" : "ok"}">Niềm tin ${F.trust}%</span>
          <span>${F.trustFail ? `Dưới ${C.trustLimit}%: tham nhũng làm hại tất cả, <b>mọi người bị trừ ${C.trustPenaltyRate * 100}% điểm</b>, kể cả những bạn trong sạch.` : `Từ ${C.trustLimit}% trở lên: lớp giữ được lòng tin, không ai bị trừ chung.`}</span></div>
        <div class="row"><span class="tag ok">Liêm chính +${C.cleanBonus}</span><span>${F.cleanN ? `<b>${F.cleanN}</b> người không đưa phong bì nào: ${names}${F.cleanN > 10 ? " và " + (F.cleanN - 10) + " người khác" : ""}` : "Không ai giữ được liêm chính suốt ván."}</span></div>
      </div>
      <div class="ctrl"><button class="btn" data-act="primary">Xem bảng thành tích <span class="kbd">Space</span></button></div></div>`;
  }
  if (H.endStep === 1) {
    const rows = F.rows, pod = (t, c) => t ? `<div class="pod ${c}"><div class="nm">${esc(t.name)}</div><div class="bar">${t.score}</div></div>` : "";
    const list = H.showAll ? rows : rows.slice(0, 10);
    const titles = r => [r.clean ? `<span class="tag ok">Liêm chính</span>` : "", r.repOk ? `<span class="tag gold">Thám tử ×${r.repOk}</span>` : "",
      r.caught ? `<span class="tag">Bị phát hiện ×${r.caught}</span>` : ""].filter(Boolean).join(" ");
    return `<div class="center"><h1 class="sm">BẢNG THÀNH TÍCH</h1>
      <div class="podium">${pod(rows[1], "p2")}${pod(rows[0], "p1")}${pod(rows[2], "p3")}</div>
      <table class="led"><tr><th class="num">Hạng</th><th>Người chơi</th><th class="num">Điểm</th><th class="num">Đúng</th><th>Danh hiệu</th></tr>
        ${list.map(r => `<tr class="${r.rank <= 3 ? "top" : ""}"><td class="num">${r.rank}</td><td>${esc(r.name)}</td><td class="num">${r.score}</td><td class="num">${r.correct}/${F.qDone}</td><td>${titles(r)}</td></tr>`).join("")}</table>
      <div class="ctrl">${rows.length > 10 ? `<button class="btn ghost" data-act="showall">${H.showAll ? "Thu gọn (top 10)" : "Hiện đủ " + rows.length + " người"}</button>` : ""}
        <button class="btn ghost" data-act="endback">Quay lại</button>
        <button class="btn" data-act="primary">Sự thật được bật mí <span class="kbd">Space</span></button></div></div>`;
  }
  const hidden = F.total - F.caught;
  return `<div class="center"><h1>SỰ THẬT ĐƯỢC BẬT MÍ</h1>
    <div class="stats"><div class="stat"><b>${F.total}</b><span>phong bì đã trao</span></div>
      <div class="stat"><b>${F.caught}</b><span>bị phát hiện</span></div>
      <div class="stat"><b>${hidden}</b><span>lọt lưới</span></div>
      <div class="stat"><b>${F.trust}%</b><span>niềm tin còn lại</span></div></div>
    <p>${F.total ? F.byPerk.filter(x => x.n).map(x => esc(PERKS[x.k].name) + ": " + x.n).join(" · ") : "Không có phong bì nào trong ván này. Cả lớp liêm chính!"}</p>
    <p>${hidden ? `${hidden} phong bì lọt lưới: tham nhũng luôn khó phát hiện, vì vậy cần đồng thời bốn chữ KHÔNG.` : "Muốn tham nhũng không còn chỗ đứng, cần đồng thời bốn chữ KHÔNG."}</p>
    <div class="four"><div><b>Không thể</b><span>thể chế, kiểm soát quyền lực</span></div><div><b>Không dám</b><span>xử lý không vùng cấm</span></div>
      <div><b>Không muốn</b><span>giáo dục, văn hóa liêm chính</span></div><div><b>Không cần</b><span>đời sống được bảo đảm</span></div></div>
    <div class="ctrl"><button class="btn ghost" data-act="endback">Quay lại bảng thành tích</button>
      <button class="btn red" data-act="closesession">Kết thúc phiên chơi</button></div></div>`;
}
function closedHTML() {
  return `<div class="center"><h1>PHIÊN CHƠI ĐÃ KẾT THÚC</h1>
    <p>Cảm ơn cả lớp đã chơi. Dữ liệu của phòng ${esc(H.room)} đã được xóa khỏi hệ thống.</p>
    <div class="ctrl"><button class="btn" data-act="newgame">Mở phòng mới</button></div></div>`;
}
function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cols = ["#f2b544", "#30a46c", "#e5484d", "#3e8ef7", "#8e6cf0"];
  for (let k = 0; k < 70; k++) {
    const e = document.createElement("i"); e.className = "conf";
    e.style.left = Math.random() * 100 + "vw"; e.style.background = cols[k % cols.length];
    e.style.animationDuration = (2.5 + Math.random() * 2.5) + "s"; e.style.animationDelay = (Math.random() * 0.8) + "s";
    document.body.appendChild(e); setTimeout(() => e.remove(), 6500);
  }
}

/* ---------- vòng lặp đồng hồ ---------- */
setInterval(() => {
  if (!H || (H.phase !== "question" && H.phase !== "backdoor")) return;
  const rem = Math.max(0, H.endsAt - now());
  paintTimer(rem, H.phase === "question" ? H.qTime : H.bdTime);
  const sec = Math.ceil(rem / 1000);
  if (sec !== R.lastSec) { R.lastSec = sec; if (sec <= 5 && sec > 0) sfx.tick(); }
  if (rem <= 0) { if (H.phase === "question") goReveal(); else processBackdoor(); }
}, 200);

/* ---------- sự kiện ---------- */
function toggleMute() { sfx.setMuted(!sfx.isMuted()); $("#muteBtn").textContent = "Âm thanh: " + (sfx.isMuted() ? "tắt" : "bật"); }
function fs() { const d = document; if (!d.fullscreenElement) { if (d.documentElement.requestFullscreen) d.documentElement.requestFullscreen(); } else if (d.exitFullscreen) d.exitFullscreen(); }
function resetToSetup() { stopAll(); try { localStorage.removeItem(SAVE_KEY); } catch (e) {} H = null; _sc = null; render(); }
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  if (b.tagName === "BUTTON") b.blur();
  const a = b.dataset.act;
  if (a === "mode") { SET.mode = b.dataset.v; render(); }
  else if (a === "n") { SET.n = +b.dataset.v; render(); }
  else if (a === "qt") { SET.qTime = +b.dataset.v; render(); }
  else if (a === "create") createRoom();
  else if (a === "resume") resume();
  else if (a === "primary") primary();
  else if (a === "mute") toggleMute();
  else if (a === "fs") fs();
  else if (a === "endnow") { if (H && LIVE.includes(H.phase) && confirm("Kết thúc ván ngay và chuyển sang bảng thành tích?")) goEnd(); }
  else if (a === "showall") { H.showAll = !H.showAll; render(); }
  else if (a === "endback") { if (H.endStep > 0) { H.endStep--; save(); render(); } }
  else if (a === "closesession") { if (confirm("Kết thúc phiên chơi? Mọi điện thoại sẽ thấy thông báo kết thúc và dữ liệu phòng bị xóa.")) closeSession(); }
  else if (a === "newgame") resetToSetup();
  else if (a === "kick" && H && H.phase === "lobby") {
    const id = b.dataset.p;
    if (!H.players[id] || !confirm("Xóa \"" + nameOf(id) + "\" khỏi phòng?")) return;
    delete H.players[id]; H.kicked[id] = true; H.events = H.events.filter(x => x.p !== id); _sc = null;
    R.store.update("private/" + id, { kicked: true });
    setTimeout(() => R.store.remove("players/" + id), 300);
    pubBoard(); save(); paintPlayers(); paintBar();
  }
});
document.addEventListener("keydown", e => {
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "select" || tag === "textarea") return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === " " || e.key === "Enter") {
    if (tag === "button" || (e.target.dataset && e.target.dataset.act === "kick")) return;
    e.preventDefault();
    if (!H) createRoom(); else primary();
  } else if (e.key === "m" || e.key === "M") toggleMute();
  else if (e.key === "f" || e.key === "F") fs();
});

if (qp.get("auto") === "1") createRoom(); else render();
})();
</script>
</body>
</html>
