<!doctype html>

<link rel="stylesheet" href="common.css">
<style>
#app{height:100vh;display:grid;grid-template-rows:auto 1fr auto}
#bar{display:flex;align-items:center;gap:16px;padding:10px 24px;border-bottom:1px solid var(--line);background:rgba(8,10,24,.6)}
.brand{font-weight:900;font-size:22px;letter-spacing:.04em;white-space:nowrap}
.brand i{font-weight:500;color:var(--gold)}

.chip{border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:14px;color:var(--muted);white-space:nowrap}

.chip b{color:var(--ink)}
.chip.act2{border-color:var(--red);color:#ffb3b5}

.tools{display:flex;gap:8px}
.tools button{background:transparent;border:1px solid var(--line);border-radius:10px;padding:6px 12px;cursor:pointer;color:var(--muted);font-size:13px}
.tools button:hover{border-color:var(--gold);color:var(--ink)}
#main{overflow:auto;padding:clamp(12px,2.4vh,30px) clamp(16px,3vw,48px);display:flex;flex-direction:column;gap:clamp(10px,2vh,20px)}
#main>:first-child{margin-top:auto}
#main>:last-child{margin-bottom:auto}
#board{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;padding:10px 20px 14px;border-top:1px solid var(--line);background:rgba(8,10,24,.7)}
#board:empty{display:none}
.tm{min-width:118px;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:6px 12px;text-align:center}
.tm .n{font-size:14px;color:var(--muted);font-weight:700;white-space:nowrap}
.tm .s{font-size:24px;font-weight:900;line-height:1.1}
.tm .d{font-size:13px;font-weight:800;min-height:1.15em}
.tm .d.up{color:var(--green)} .tm .d.no{color:var(--red)}
.tm.click{cursor:pointer}
.tm.click:hover{border-color:var(--gold)}
.tm.on{border-color:var(--green);background:rgba(48,164,108,.18)}
/* setup */
.setup{display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:center;max-width:1200px;width:100%;margin-inline:auto}
@media(max-width:900px){.setup{grid-template-columns:1fr}}
.hero h1{font-size:clamp(46px,10vh,104px);margin:0;line-height:.95;font-weight:900}
.hero h1 i{color:var(--gold);font-weight:500}
.hero p{font-size:clamp(16px,2.4vh,21px);max-width:32em}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;display:grid;gap:12px}
.card h2{margin:0;font-size:20px}
.lbl{font-size:13px;color:var(--muted);margin-bottom:4px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.radio{border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;background:transparent;color:var(--ink);text-align:left}

.radio.on{border-color:var(--gold);background:rgba(242,181,68,.12)}

.note{font-size:13px;color:var(--muted)}
.note a{color:var(--gold)}

.lobby{display:grid;grid-template-columns:minmax(260px,400px) 1fr;gap:24px;align-items:start;max-width:1200px;width:100%;margin-inline:auto}
@media(max-width:900px){.lobby{grid-template-columns:1fr}}
.join{background:#fff;color:#141629;border-radius:var(--radius);padding:18px;text-align:center}

.url{font-size:13px;word-break:break-all;color:#4b4f6b}
.side{display:grid;gap:12px}
.side h2{margin:0;font-size:22px}
.teams{display:flex;flex-wrap:wrap;gap:8px;min-height:40px}
.teams span{background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-weight:800;animation:pop .35s}

.rules{margin:0;padding-left:1.1em;display:grid;gap:4px;font-size:clamp(14px,2.2vh,17px)}
table.pk{border-collapse:collapse;width:100%;font-size:15px}

.mteams{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.mteams input,.card select,.inrow select{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--ink);width:100%}
/* question */
.qtop{display:flex;align-items:center;gap:12px}
.qn{font-weight:900;font-size:20px}
.grow{flex:1}
.timer{position:relative;width:clamp(62px,11vh,96px);aspect-ratio:1;flex:none}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer circle{fill:none;stroke-width:9}
.timer .bg{stroke:var(--line)}
.timer .fg{stroke:var(--gold);stroke-linecap:round}
.timer .num{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:clamp(22px,4vh,34px)}
.timer.low .fg{stroke:var(--red)}
.timer.low .num{color:var(--red)}
.timer.big{width:clamp(90px,16vh,140px)}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(8px,1.6vh,16px)}
.op{display:flex;align-items:center;gap:14px;border-radius:14px;padding:clamp(8px,1.8vh,20px) 18px;min-height:clamp(56px,10.5vh,108px);font-size:clamp(17px,min(1.9vw,3.3vh),30px);font-weight:800;color:#fff;transition:opacity .3s,transform .3s,box-shadow .3s}
.op .shape{font-size:1.25em;width:1.4em;text-align:center;flex:none}

.op em{margin-left:auto;font-style:normal;font-size:.7em;background:rgba(0,0,0,.28);border-radius:99px;padding:2px 10px;white-space:nowrap}
.grid.rev .op{opacity:.33}
.grid.rev .op.ok{opacity:1;transform:scale(1.02);box-shadow:0 0 0 4px #fff}
.explain{background:var(--panel2);border-left:8px solid var(--green);border-radius:12px;padding:10px 18px;font-size:clamp(15px,2.4vh,20px)}
.explain small{display:block;color:var(--muted);margin-top:4px;font-size:.8em}
.ctrl{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;align-items:center}
.kbd{font-size:12px;opacity:.7;border:1px solid currentColor;border-radius:5px;padding:0 5px;margin-left:6px}
/* backdoor */
body.night{background:radial-gradient(1000px 620px at 50% 0%,#521126 0%,#13070d 70%) fixed}

.big-num{font-size:clamp(48px,11vh,110px);font-weight:900;line-height:1}

.row .r{margin-left:auto;font-weight:900;white-space:nowrap}

.inrow{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.inrow select{width:auto}
.stamp{display:inline-block;border:4px solid var(--red);color:var(--red);border-radius:10px;padding:2px 14px;font-weight:900;letter-spacing:.12em;transform:rotate(-5deg);font-size:clamp(16px,2.6vh,22px)}
.stamp.ok{border-color:var(--green);color:var(--green)}
/* end */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:16px}
.pod{width:clamp(120px,16vw,220px);text-align:center;display:grid;gap:6px}
.pod .nm{font-weight:900;font-size:clamp(16px,2.6vh,22px)}
.pod .bar{border-radius:14px 14px 0 0;display:grid;place-items:center;font-size:clamp(22px,4vh,32px);font-weight:900;color:#271a03}
.pod.p1 .bar{height:clamp(110px,26vh,230px);background:linear-gradient(#ffd77a,#e9a720)}
.pod.p2 .bar{height:clamp(80px,19vh,170px);background:linear-gradient(#eef1f7,#aab4c8)}
.pod.p3 .bar{height:clamp(60px,14vh,125px);background:linear-gradient(#f3c49b,#c4844f)}
.rest{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.rest span{background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:4px 14px;color:var(--muted)}
.stats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 22px;text-align:center;min-width:150px}
.stat b{display:block;font-size:clamp(28px,5vh,42px);line-height:1.1}
.stat span{color:var(--muted);font-size:14px}
table.led{width:100%;max-width:920px;margin:0 auto;border-collapse:collapse;font-size:clamp(14px,2.2vh,17px)}
table.led th,table.led td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left}
table.led th{color:var(--muted);font-weight:600}
.four{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:920px;width:100%;margin:0 auto}
.four div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.four b{display:block;font-size:20px}
.four span{color:var(--muted);font-size:13px}
.bigtrust .tbar{width:min(520px,70vw);height:22px}
.bigtrust{font-size:22px;justify-content:center}
.conf{position:fixed;top:-20px;width:10px;height:16px;z-index:50;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style>

<script>
(function(){
"use strict";
const { CONFIG: C, PERKS, esc, uid, roomCode, openStore, sfx, signed } = window.LHL;

/* Câu hỏi: t = đề, o = 4 đáp án, a = đáp án đúng (0-3), e = giải thích, s = căn cứ */
const QUESTIONS = [
  { t: "Theo Luật Phòng, chống tham nhũng 2018, tham nhũng là hành vi của người có chức vụ, quyền hạn đã lợi dụng chức vụ, quyền hạn đó…",
    o: ["vì vụ lợi", "gây thiệt hại trên 100 triệu đồng", "để giúp người thân", "khi làm việc trong cơ quan nhà nước"], a: 0,
    e: "Phải có cùng lúc hai yếu tố: có chức vụ, quyền hạn và lợi dụng nó vì vụ lợi. Luật không đặt ngưỡng số tiền.", s: "Luật PCTN 2018, khoản 1 Điều 3" },
  { t: "Tình huống nào KHÔNG phải là tham nhũng?",

    e: "Thiếu yếu tố vụ lợi: đây là vi phạm, gây lãng phí và vẫn phải chịu trách nhiệm, nhưng chưa phải tham nhũng.", s: "Luật PCTN 2018, Điều 3" },
  { t: "Năm 1994, Hội nghị đại biểu toàn quốc giữa nhiệm kỳ khóa VII xác định \"nạn tham nhũng và tệ quan liêu\" là…",
    o: ["một trong bốn nguy cơ", "nhiệm vụ trọng tâm duy nhất", "hiện tượng nhất thời", "vấn đề riêng của khu vực tư nhân"], a: 0,
    e: "Dấu mốc Đảng thẳng thắn chỉ ra một nguy cơ nội tại có thể ảnh hưởng tới sự tồn vong của chế độ.", s: "Lê Văn Lợi, Tạp chí Lịch sử Đảng, số 6-2025" },
  { t: "Hai văn bản quy định mâu thuẫn nhau về điều kiện giao đất, mỗi nơi hiểu một kiểu. Đây là hạn chế thuộc nhóm nào?",
    o: ["Chính sách, pháp luật", "Phát hiện, xử lý", "Tuyên truyền, phổ biến", "Bổ nhiệm cán bộ"], a: 0,
    e: "Pháp luật chồng chéo, mâu thuẫn, thiếu minh bạch tạo khoảng trống để áp dụng tùy tiện.", s: "Slide Session 29: hạn chế về pháp luật" },
  { t: "Người dân biết sai phạm nhưng không dám tố cáo vì sợ bị trả thù. Đây là hạn chế trong…",
    o: ["Quản lý, điều hành kinh tế", "Phát hiện và xử lý tham nhũng", "Tuyên truyền, phổ biến", "Chính sách, pháp luật"], a: 1,

  { t: "\"Nhân dân giảm sút lòng tin vào sự lãnh đạo của Đảng và sự quản lý của Nhà nước\" là tác hại về mặt nào?",

  { t: "Ban Chỉ đạo Trung ương về phòng, chống tham nhũng (thành lập đầu năm 2013) do ai làm Trưởng ban?",
    o: ["Thủ tướng Chính phủ", "Chủ tịch Quốc hội", "Tổng Bí thư", "Tổng Thanh tra Chính phủ"], a: 2,

  { t: "\"Xử lý vi phạm không có vùng cấm, không có ngoại lệ\" nhằm để cán bộ…",

    e: "Xử lý nghiêm minh tạo sức răn đe: không dám. Bốn chữ KHÔNG bổ trợ cho nhau.", s: "Chỉ thị 42-CT/TW (16/1/2025)" },
  { t: "Luật PCTN 2018 mở rộng phòng, chống tham nhũng sang khu vực nào?",
    o: ["Khu vực ngoài nhà nước", "Chỉ lực lượng vũ trang", "Chỉ chính quyền cấp xã", "Các tổ chức quốc tế"], a: 0,
    e: "Doanh nghiệp, tổ chức ngoài nhà nước cũng có thể có tham ô, nhận hối lộ, đưa và môi giới hối lộ.", s: "Kết luận 10-KL/TW (2017); Luật PCTN 2018" },
  { t: "Trong nhiệm kỳ Đại hội XIII, bao nhiêu cán bộ diện Trung ương quản lý bị xử lý kỷ luật?",
    o: ["74", "174", "274", "1.740"], a: 1,
    e: "174 cán bộ bị kỷ luật, trong đó 66 người bị xử lý hình sự.", s: "Hội nghị tổng kết nhiệm kỳ XIII, 11/12/2025" },
  { t: "Nâng cao đời sống cho cán bộ, công chức, viên chức nhằm để họ…",

    e: "Đời sống được bảo đảm thì giảm động cơ tham nhũng để bù đắp.", s: "Chỉ thị 42-CT/TW (16/1/2025)" },
  { t: "Chỉ số cảm nhận tham nhũng (CPI) 2025 chấm Việt Nam bao nhiêu điểm trên thang 100?",
    o: ["31", "41", "51", "61"], a: 1,
    e: "Việt Nam đạt 41/100, xếp 81/182. Năm 2012 là 31 điểm: có tiến bộ nhưng còn nhiều việc phải làm.", s: "Transparency International, 10/2/2026" }
];
const ORDERS = { 8: [0, 1, 2, 3, 4, 5, 6, 7], 12: [0, 1, 8, 2, 3, 4, 5, 9, 6, 7, 10, 11] };
const PLAN = { 8: { inspect: [2, 5, 7], act2: 4 }, 12: { inspect: [2, 5, 8, 11], act2: 6 } };
const SHAPES = ["▲", "◆", "●", "■"];
const SAVE_KEY = "lhl-host-save";
const qp = new URLSearchParams(location.search);
const $ = s => document.querySelector(s);

let H = null;                       // trạng thái ván chơi (lưu được)
if (qp.get("debug") === "1") window.__lhl = { get H() { return H; } };
const R = { store: null, unsub: {}, conn: true, lastSec: -1 };  // phần chạy, không lưu
const SET = {
  mode: qp.get("mode") === "local" ? "local" : qp.get("mode") === "manual" ? "manual" : (window.FIREBASE_CONFIG ? "firebase" : "local"),

/* ---------- tiện ích ---------- */
const now = () => (R.store ? R.store.now() : Date.now());
const teamIds = () => Object.keys(H.teams).sort((a, b) => H.teams[a].at - H.teams[b].at);
const nameOf = id => (H.teams[id] ? H.teams[id].name : "?");
const curQ = () => QUESTIONS[H.order[H.qi]];
function score(id) { let s = 0; for (const e of H.events) if (e.team === id) s += e.d; return s; }
function ev(team, d, tag, why) { if (d) H.events.push({ team, d, tag, why }); }
function unev(tag) { H.events = H.events.filter(e => e.tag !== tag); }
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(H)); } catch (e) {} }
function stopSub(k) { if (R.unsub[k]) { try { R.unsub[k](); } catch (e) {} R.unsub[k] = null; } }
function fresh(mode, room) {
  return { v: 1, mode, room, n: SET.n, order: ORDERS[SET.n], qTime: SET.qTime, bdTime: C.backdoorTime,
    phase: "lobby", qi: -1, act: 1, trust: 100, startAt: 0, endsAt: 0, early: false,
    teams: {}, events: [], ledger: [], answers: {}, results: {}, mult: {}, bribesNow: {},
    reports: {}, reportsDone: {}, inspectNo: 0, inspectedAfter: -1, lastInspect: null, lastBd: null,
    endStep: 0, final: null };
}
function joinURL() {
  return new URL("index.html?room=" + H.room + (H.mode === "local" ? "&mode=local" : ""), location.href).href;
}

/* ---------- đồng bộ với điện thoại ---------- */
function pubState() {
  const q = (H.phase === "question" || H.phase === "reveal") ? curQ() : null;
  R.store.set("state", {
    phase: H.phase, qi: H.qi, total: H.order.length, act: H.act, trust: H.trust, endsAt: H.endsAt,
    q: q ? { t: q.t, o: q.o } : null,
    reveal: H.phase === "reveal" ? { a: q.a, e: q.e } : null,
    insp: H.phase === "inspres" ? H.lastInspect : null,
    final: H.phase === "end" ? H.final : null,
    rate: C.detectRate[H.act - 1], ts: now()
  });
  save();
}
function pubBoard() {
  const b = {};
  teamIds().forEach(id => { b[id] = { name: H.teams[id].name, score: score(id) }; });
  R.store.set("board", b);
}
function note(id, text, tone) { R.store.update("private/" + id, { note: { at: now(), text, tone: tone || "info" } }); }
function subscribeCore() {
  if (H.mode === "manual") return;
  stopSub("teams"); stopSub("reports");
  R.unsub.teams = R.store.on("teams", v => {
    v = v || {}; let changed = false;
    for (const id in v) {
      if (!H.teams[id] && v[id] && !(H.kicked && H.kicked[id])) {
        H.teams[id] = { name: String(v[id].name || "Đội").slice(0, 20), at: v[id].at || now() };
        ev(id, C.startScore, "start", "Vốn ban đầu"); changed = true;
      }
    }
    if (changed) { pubBoard(); save(); if (H.phase === "lobby") render(); else paintBoard(); }
  });
  R.unsub.reports = R.store.on("reports", v => {
    H.reports = v || {}; save();
    if (H.phase === "inspect") render();
  });
}

/* ---------- các pha của ván chơi ---------- */
function startGame() { if (!teamIds().length) return; H.qi = 0; goQuestion(); }

function goQuestion() {
  H.phase = "question"; H.early = false;
  H.startAt = now(); H.endsAt = H.startAt + H.qTime * 1000;
  H.answers[H.qi] = H.answers[H.qi] || {};
  if (H.mode !== "manual") {
    const qi = H.qi; stopSub("ans");
    R.unsub.ans = R.store.on("answers/" + qi, v => {
      if (H.phase !== "question" || H.qi !== qi) return;
      H.answers[qi] = v || {};
      const ids = teamIds(), n = ids.filter(id => H.answers[qi][id]).length;
      const el = $("#ansCount"); if (el) el.textContent = n + "/" + ids.length;
      if (ids.length && n >= ids.length && !H.early) { H.early = true; H.endsAt = Math.min(H.endsAt, now() + 1200); }
    });
  }
  R.lastSec = -1; pubState(); render();
}

function goReveal() {
  if (H.phase !== "question") return;
  stopSub("ans"); H.phase = "reveal";
  scoreQuestion(H.qi); pubState(); pubBoard(); render(); sfx.good();
}

function scoreQuestion(qi) {
  const q = QUESTIONS[H.order[qi]], ans = H.answers[qi] || {}, res = {};
  const limit = H.startAt + H.qTime * 1000 + 1500;
  unev("q:" + qi);
  teamIds().forEach(id => {
    const a = ans[id];
    let ok = !!a && a.c === q.a;
    if (ok && a.at && a.at > limit) ok = false;
    let pts = 0;
    if (ok) {
      const sp = a.at ? Math.max(0, Math.min(1, 1 - (a.at - H.startAt) / (H.qTime * 1000))) : 0;
      pts = Math.round(C.basePoints + C.speedBonus * sp);
      if (H.mult[qi] && H.mult[qi][id]) pts *= 2;
      ev(id, pts, "q:" + qi, "Đúng câu " + (qi + 1));
    }
    res[id] = { ok, pts, c: a ? a.c : -1 };
  });
  H.results[qi] = res;
  H.ledger.forEach(L => { if (L.q === qi && (L.perk === "lode" || L.perk === "chay")) L.gain = res[L.team] ? res[L.team].pts : 0; });
  R.store.set("results/" + qi, res);
}

function afterQuestion() {
  const plan = PLAN[H.n];
  if (plan.inspect.includes(H.qi) && H.inspectedAfter !== H.qi) return goInspect();
  if (H.act === 1 && H.qi + 1 === plan.act2) { H.act = 2; H.phase = "act"; pubState(); render(); sfx.siren(); return; }
  if (H.qi + 1 < H.order.length) { H.qi++; return goBackdoor(); }
  goEnd();
}

function goBackdoor() {
  H.phase = "backdoor"; H.bribesNow = {}; H.early = false;
  H.endsAt = now() + H.bdTime * 1000; H.mult[H.qi] = H.mult[H.qi] || {};
  if (H.mode !== "manual") {
    const qi = H.qi; stopSub("br");
    R.unsub.br = R.store.on("bribes/" + qi, v => {
      if (H.phase !== "backdoor" || H.qi !== qi) return;
      H.bribesNow = v || {};
      const ids = teamIds(), n = ids.filter(id => H.bribesNow[id]).length;
      const el = $("#bdCount"); if (el) el.textContent = n + "/" + ids.length;
      if (ids.length && n >= ids.length && !H.early) { H.early = true; H.endsAt = Math.min(H.endsAt, now() + 1200); }
    });
  }
  R.lastSec = -1; pubState(); render(); sfx.coin();
}

function processBackdoor() {
  if (H.phase !== "backdoor") return;
  stopSub("br");
  const qi = H.qi, q = curQ(); let count = 0;
  teamIds().forEach(id => {
    const b = H.bribesNow[id]; if (!b || !PERKS[b.perk]) return;
    const P = PERKS[b.perk];
    if (score(id) < P.price) { note(id, "Không đủ điểm, phong bì bị trả lại.", "warn"); return; }
    let fixQ = null;
    if (b.perk === "xoa") {
      for (let j = qi - 1; j >= 0; j--) { const r = H.results[j] && H.results[j][id]; if (r && !r.ok) { fixQ = j; break; } }
      if (fixQ === null) { note(id, "Đội chưa sai câu nào, phong bì bị trả lại.", "warn"); return; }
    }
    const L = { id: uid(6), team: id, perk: b.perk, q: qi, cost: P.price, gain: 0, rolled: false, caught: false, fixQ };
    ev(id, -P.price, "cost:" + L.id, "Phong bì " + P.name);
    if (b.perk === "lode") {
      const wrong = q.o.map((_, i) => i).filter(i => i !== q.a);
      const keep = [q.a, wrong[Math.floor(Math.random() * wrong.length)]].sort((x, y) => x - y);
      R.store.update("private/" + id, { elim: { qi, keep } });
    }
    if (b.perk === "chay") H.mult[qi][id] = true;
    if (b.perk === "xoa") {
      const r = H.results[fixQ][id];
      H.results[fixQ][id] = { ok: true, pts: C.basePoints, c: r.c, fixed: true };
      ev(id, C.basePoints, "fix:" + L.id, "Xóa án câu " + (fixQ + 1)); L.gain = C.basePoints;
      R.store.set("results/" + fixQ + "/" + id, H.results[fixQ][id]);
    }
    H.ledger.push(L); count++;
    H.trust = Math.max(0, H.trust - C.trustPerBribe);
    note(id, "Đã trao phong bì " + P.name + " (−" + P.price + " điểm). Coi chừng thanh tra!", "bribe");
  });
  H.lastBd = { qi, count }; H.phase = "bdsum";
  pubState(); pubBoard(); render(); if (count) sfx.coin();
}

function goInspect() { H.phase = "inspect"; pubState(); render(); sfx.siren(); }

function catchL(L, by, no) {
  L.caught = true; L.by = by; L.caughtAt = no;
  L.claw = Math.max(0, L.gain || 0); L.fine = C.fineMultiplier * L.cost;
  ev(L.team, -L.claw, "claw:" + L.id, "Thu hồi lợi ích");
  ev(L.team, -L.fine, "fine:" + L.id, "Phạt phong bì");
  H.trust = Math.min(100, H.trust + C.trustPerCatch);
}

function runInspect() {
  if (H.phase !== "inspect") return;
  const no = H.inspectNo + 1, rate = C.detectRate[H.act - 1], caught = [], reps = [];
  Object.keys(H.reports || {}).forEach(from => {
    const r = H.reports[from];
    if (H.reportsDone[from] || !r || !H.teams[from] || !H.teams[r.target] || r.target === from) return;
    H.reportsDone[from] = true;
    const ok = H.ledger.some(L => L.team === r.target && (!L.caught || L.caughtAt === no));
    H.ledger.forEach(L => { if (L.team === r.target && !L.caught) { catchL(L, "tố giác", no); caught.push(L); } });
    const d = ok ? C.reportReward[H.act - 1] : -C.reportFalsePenalty;
    ev(from, d, "rep:" + from, ok ? "Tố giác đúng" : "Tố giác sai");
    reps.push({ from, target: r.target, ok, d });
  });
  H.ledger.forEach(L => {
    if (L.caught || L.rolled) return;
    const prior = H.ledger.filter(x => x.team === L.team && x.rolled).length;  // càng tham càng dễ lộ
    L.rolled = true;
    if (Math.random() < Math.min(C.detectMax, rate + C.repeatStep * prior)) { catchL(L, "thanh tra", no); caught.push(L); }
  });
  H.inspectNo = no; H.inspectedAfter = H.qi;
  H.lastInspect = { no, rate, caught: caught.map(L => ({ team: L.team, perk: L.perk, q: L.q, claw: L.claw, fine: L.fine, by: L.by })), reports: reps };
  H.phase = "inspres";
  caught.forEach(L => note(L.team, "Bị phát hiện phong bì " + PERKS[L.perk].name + ": thu hồi " + L.claw + ", phạt " + L.fine + " điểm.", "caught"));
  reps.forEach(r => { if (!caught.some(L => L.team === r.from)) note(r.from, r.ok ? "Tố giác đúng! +" + r.d + " điểm." : "Tố giác sai: " + r.d + " điểm.", r.ok ? "good" : "warn"); });
  pubState(); pubBoard(); render();
  if (caught.length) sfx.bad(); else sfx.good();
}

function goEnd() {
  if (!H.final) {
    const ids = teamIds(), trustFail = H.trust < C.trustLimit;
    if (trustFail) ids.forEach(id => ev(id, -Math.round(Math.max(0, score(id)) * C.trustPenaltyRate), "end:trust", "Niềm tin sụp đổ"));
    const cleanTeams = ids.filter(id => !H.ledger.some(L => L.team === id));
    cleanTeams.forEach(id => ev(id, C.cleanBonus, "end:clean", "Đội liêm chính"));
    const ranking = ids.map(id => ({ id, name: nameOf(id), score: score(id), bribes: H.ledger.filter(L => L.team === id).length })).sort((a, b) => b.score - a.score);
    H.final = { trust: H.trust, trustFail, clean: cleanTeams, ranking,
      ledger: H.ledger.map(L => ({ team: L.team, perk: L.perk, q: L.q, cost: L.cost, caught: L.caught, by: L.by || null })),
      total: H.ledger.length, caught: H.ledger.filter(L => L.caught).length };
  }
  H.phase = "end"; H.endStep = 0; pubState(); pubBoard(); render(); sfx.fanfare(); setTimeout(confetti, 300);
}

function primary() {
  if (!H) return;
  switch (H.phase) {
    case "lobby": return startGame();
    case "question": return goReveal();
    case "reveal": return afterQuestion();
    case "backdoor": return processBackdoor();
    case "bdsum": return goQuestion();
    case "inspect": return runInspect();
    case "inspres": case "act": return afterQuestion();
    case "end": if (H.endStep < 2) { H.endStep++; save(); render(); } return;
  }
}

/* ---------- tạo phòng / tiếp tục ---------- */
async function createRoom() {
  sfx.unlock();
  const room = (qp.get("room") || roomCode()).toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8) || roomCode();
  const storeRoom = SET.mode === "manual" ? "MANUAL-" + room : room;
  try { R.store = await openStore(SET.mode === "firebase" ? "firebase" : "local", storeRoom); }
  catch (e) { alert("Không mở được kết nối: " + e.message); return; }
  await R.store.reset();
  H = fresh(SET.mode, room);
  R.store.onConnection(c => { R.conn = c; paintBar(); });
  subscribeCore(); pubState(); pubBoard(); render();
}
async function resume() {
  let saved = null; try { saved = JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) {}
  if (!saved) return;
  sfx.unlock();
  try { R.store = await openStore(saved.mode === "firebase" ? "firebase" : "local", saved.mode === "manual" ? "MANUAL-" + saved.room : saved.room); }
  catch (e) { alert("Không mở được kết nối: " + e.message); return; }
  H = saved;
  R.store.onConnection(c => { R.conn = c; paintBar(); });
  subscribeCore();
  if (H.phase === "question") goQuestion();
  else if (H.phase === "backdoor") goBackdoor();
  else { pubState(); pubBoard(); render(); }
}
function addManualTeams() {
  const inputs = [...document.querySelectorAll("[data-mname]")];
  inputs.forEach((inp, k) => {
    const id = "m" + (k + 1);
    const nm = (inp.value.trim() || "Nhóm " + (k + 1)).slice(0, 20);
    if (!H.teams[id]) { H.teams[id] = { name: nm, at: Date.now() + k }; ev(id, C.startScore, "start", "Vốn ban đầu"); }
    else H.teams[id].name = nm;
  });
  pubBoard(); save(); render();
}

/* ---------- vẽ màn hình ---------- */
function trustHTML(t, big) {
  const cls = t >= 70 ? "" : t >= 50 ? "mid" : "low";
  return `<div class="trust ${cls} ${big ? "bigtrust" : ""}"><span class="muted">${big ? "Niềm tin của lớp" : "Niềm tin"}</span><div class="tbar"><i style="width:${t}%"></i></div><b>${t}%</b></div>`;
}
function paintBar() {
  const info = $("#barInfo"), tr = $("#trust");
  if (!H) { info.innerHTML = ""; tr.hidden = true; return; }
  const modeName = { firebase: "Online", local: "Thử 1 máy", manual: "Thủ công" }[H.mode];
  const qtxt = H.qi >= 0 ? `<span class="chip">Câu <b>${Math.min(H.qi + 1, H.order.length)}/${H.order.length}</b></span>` : "";
  info.innerHTML = `<span class="chip">Phòng <b>${esc(H.room)}</b></span>${qtxt}
    <span class="chip ${H.act === 2 ? "act2" : ""}">Màn <b>${H.act}</b> · thanh tra ${Math.round(C.detectRate[H.act - 1] * 100)}%</span>
    ${H.mode !== "firebase" || !R.conn ? `<span class="chip ${R.conn ? "" : "off"}">${modeName}${R.conn ? "" : " · mất kết nối"}</span>` : ""}`;
  tr.hidden = false; tr.outerHTML = trustHTML(H.trust).replace('<div class="trust', '<div id="trust" class="trust');
}
function paintBoard() {
  const el = $("#board");
  if (!H || (H.phase === "lobby" && !teamIds().length) || (H.phase === "end" && H.endStep >= 1)) { el.innerHTML = ""; return; }
  const showDelta = H.phase === "reveal";
  const manualMark = H.mode === "manual" && H.phase === "reveal";
  let ids = teamIds();
  if (["reveal", "inspres", "bdsum", "end", "act"].includes(H.phase)) ids = ids.slice().sort((a, b) => score(b) - score(a));
  const res = H.results[H.qi] || {};
  el.innerHTML = ids.map(id => {
    const r = res[id]; let d = "";
    if (showDelta) d = r && r.ok ? `<div class="d up">+${r.pts}</div>` : `<div class="d no">✗</div>`;
    else d = `<div class="d"></div>`;
    return `<div class="tm ${manualMark ? "click" : ""} ${manualMark && r && r.ok ? "on" : ""}" ${manualMark ? `data-act="mtoggle" data-team="${id}" role="button" tabindex="0"` : ""}>
      <div class="n">${esc(nameOf(id))}</div><div class="s">${score(id)}</div>${d}</div>`;
  }).join("");
}
function timerHTML(big) {
  return `<div class="timer ${big ? "big" : ""}" id="timer"><svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="44"/><circle class="fg" cx="50" cy="50" r="44" stroke-dasharray="276.46" stroke-dashoffset="0"/></svg><div class="num">–</div></div>`;
}
function paintTimer(rem, total) {
  const el = $("#timer"); if (!el) return;
  const ratio = Math.max(0, Math.min(1, rem / (total * 1000)));
  el.querySelector(".fg").style.strokeDashoffset = (276.46 * (1 - ratio)).toFixed(1);
  const sec = Math.ceil(rem / 1000);
  el.querySelector(".num").textContent = sec;
  el.classList.toggle("low", sec <= 5);
}
const envelopeSVG = `<svg class="env" viewBox="0 0 120 84" aria-hidden="true"><rect x="4" y="10" width="112" height="70" rx="8" fill="#f2e3c4"/><path d="M4 18 L60 52 L116 18" fill="none" stroke="#c9a76a" stroke-width="5"/><circle cx="60" cy="50" r="12" fill="#e5484d"/><text x="60" y="56" text-anchor="middle" font-size="16" font-weight="900" fill="#fff">₫</text></svg>`;

function render() {
  document.body.className = H && (H.phase === "backdoor" || H.phase === "bdsum") ? "night" : H && (H.phase === "inspect" || H.phase === "inspres" || H.phase === "act") ? "siren" : "";
  const m = $("#main");
  if (!H) { m.innerHTML = setupHTML(); paintBar(); paintBoard(); return; }
  const f = { lobby: lobbyHTML, question: questionHTML, reveal: questionHTML, backdoor: backdoorHTML, bdsum: bdsumHTML,
    inspect: inspectHTML, inspres: inspresHTML, act: actHTML, end: endHTML }[H.phase];
  m.innerHTML = f();
  paintBar(); paintBoard();
  if (H.phase === "lobby" && H.mode !== "manual") drawQR();
  if (H.phase === "question" || H.phase === "backdoor") paintTimer(Math.max(0, H.endsAt - now()), H.phase === "question" ? H.qTime : H.bdTime);
}

      </div></div>

    </section></div>`;

function lobbyHTML() {
  const ids = teamIds();
  const rules = `<ul class="rules">

function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cols = ["#f2b544", "#30a46c", "#e5484d", "#3e8ef7", "#8e6cf0"];
  for (let k = 0; k < 70; k++) {
    const e = document.createElement("i"); e.className = "conf";
    e.style.left = Math.random() * 100 + "vw"; e.style.background = cols[k % cols.length];
    e.style.animationDuration = (2.5 + Math.random() * 2.5) + "s"; e.style.animationDelay = (Math.random() * 0.8) + "s";
    document.body.appendChild(e); setTimeout(() => e.remove(), 6500);
  }
}

setInterval(() => {
  if (!H || (H.phase !== "question" && H.phase !== "backdoor")) return;
  const rem = Math.max(0, H.endsAt - now());
  paintTimer(rem, H.phase === "question" ? H.qTime : H.bdTime);
  const sec = Math.ceil(rem / 1000);
  if (sec !== R.lastSec) { R.lastSec = sec; if (sec <= 5 && sec > 0) sfx.tick(); }
  if (rem <= 0) { if (H.phase === "question") goReveal(); else processBackdoor(); }
}, 200);

function toggleMute() { sfx.setMuted(!sfx.isMuted()); $("#muteBtn").textContent = "Âm thanh: " + (sfx.isMuted() ? "tắt" : "bật"); }
function fs() { const d = document; if (!d.fullscreenElement) { if (d.documentElement.requestFullscreen) d.documentElement.requestFullscreen(); } else if (d.exitFullscreen) d.exitFullscreen(); }
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  if (b.tagName === "BUTTON") b.blur();
  const a = b.dataset.act;
  if (a === "mode") { SET.mode = b.dataset.v; render(); }
  else if (a === "n") { SET.n = +b.dataset.v; render(); }
  else if (a === "qt") { SET.qTime = +b.dataset.v; render(); }
  else if (a === "create") createRoom();
  else if (a === "resume") resume();
  else if (a === "primary") primary();
  else if (a === "mute") toggleMute();
  else if (a === "fs") fs();
  else if (a === "newgame") { if (confirm("Kết thúc ván này và tạo ván mới?")) { localStorage.removeItem(SAVE_KEY); Object.keys(R.unsub).forEach(stopSub); H = null; render(); } }
  else if (a === "kick" && H && H.phase === "lobby") {
    const id = b.dataset.team;
    if (!H.teams[id] || !confirm("Xóa đội \"" + nameOf(id) + "\" khỏi phòng?")) return;
    delete H.teams[id]; H.events = H.events.filter(x => x.team !== id);
    H.kicked = H.kicked || {}; H.kicked[id] = true;
    R.store.update("private/" + id, { kicked: true });
    setTimeout(() => R.store.remove("teams/" + id), 300);
    pubBoard(); save(); render();
  }
  else if (a === "mteams") addManualTeams();
  else if (a === "maddrow") { addManualTeams(); const k = teamIds().length; const id = "m" + (k + 1); H.teams[id] = { name: "Nhóm " + (k + 1), at: Date.now() + k }; ev(id, C.startScore, "start", "Vốn ban đầu"); pubBoard(); save(); render(); }
  else if (a === "mtoggle") {
    const id = b.dataset.team, q = curQ(); H.answers[H.qi] = H.answers[H.qi] || {};
    const cur = H.answers[H.qi][id];
    H.answers[H.qi][id] = cur && cur.c === q.a ? { c: -1 } : { c: q.a };
    scoreQuestion(H.qi); pubBoard(); save(); paintBoard();
  }
  else if (a === "mbribe") { const id = b.dataset.team, k = b.dataset.perk; if (k === "none") delete H.bribesNow[id]; else H.bribesNow[id] = { perk: k }; render(); }
  else if (a === "mreport") { const f = $("#repFrom").value, t = $("#repTo").value; if (f && t && f !== t && !H.reportsDone[f]) { H.reports[f] = { target: t, at: now() }; save(); render(); } }
});
document.addEventListener("keydown", e => {
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "select" || tag === "textarea") return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === " " || e.key === "Enter") {
    if (tag === "button") return;
    const chip = e.target.closest && e.target.closest("[data-act='mtoggle']");
    if (chip) { e.preventDefault(); chip.click(); return; }
    e.preventDefault();
    if (!H) createRoom(); else primary();
  } else if (e.key === "m" || e.key === "M") toggleMute();
  else if (e.key === "f" || e.key === "F") fs();
});

if (qp.get("auto") === "1") createRoom(); else render();
})();
</script>
