<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1222">
<title>Liêm hay Lách? · Người chơi</title>
<link rel="stylesheet" href="common.css">
<style>
body{font-size:16px}
#app{min-height:100svh;max-width:520px;margin:0 auto;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:rgba(8,10,24,.6);position:sticky;top:0;z-index:5}
header .nm{font-weight:900;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header .sc{font-weight:900;font-size:20px}
header .rk{font-size:12px;color:var(--muted)}
header .dot{width:10px;height:10px;border-radius:50%;background:var(--green);flex:none}
header .dot.off{background:var(--red)}
.trustline{padding:6px 14px;border-bottom:1px solid var(--line)}
.trustline .trust{font-size:12px}
.trustline .tbar{flex:1;width:auto}
main{flex:1;padding:16px 14px 24px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:26px;line-height:1.15}
h2{margin:0;font-size:20px}
p{margin:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:grid;gap:10px}
.center{text-align:center}
.big{font-size:44px;font-weight:900;line-height:1}
.field{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--ink);width:100%;font-size:18px}
.btn{width:100%;font-size:18px;padding:14px}
.cd{font-weight:900;font-size:28px;text-align:center}
.cd.low{color:var(--red)}
.qt{font-size:17px;font-weight:700;line-height:1.35;background:#fff;color:#141629;border-radius:14px;padding:12px 14px}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ans button{border:0;border-radius:14px;min-height:96px;padding:10px;color:#fff;font-weight:800;font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.ans button .shape{font-size:30px;line-height:1}
.ans button:active{transform:translateY(2px)}
.ans .o0{background:var(--o0)} .ans .o1{background:var(--o1)} .ans .o2{background:var(--o2)} .ans .o3{background:var(--o3)}
.ans button.gone{visibility:hidden}
.badge{display:inline-block;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:800;background:var(--gold);color:#271a03}
.badge.red{background:var(--red);color:#fff}
.perk{display:grid;gap:2px;text-align:left;border:2px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);border-radius:14px;padding:12px 14px;cursor:pointer;color:var(--ink)}
.perk b{font-size:18px}
.perk .p{color:var(--gold);font-weight:900}
.perk span{color:var(--muted);font-size:13px}
.perk.on{border-color:var(--gold);background:rgba(242,181,68,.14)}
.perk[disabled]{opacity:.4;cursor:not-allowed}
body.night{background:radial-gradient(700px 500px at 50% 0%,#521126 0%,#13070d 75%) fixed}
body.siren{background:radial-gradient(700px 500px at 50% 0%,#0d3363 0%,#070b16 75%) fixed}
.result{border-radius:18px;padding:22px 16px;text-align:center;display:grid;gap:6px}
.result.ok{background:rgba(48,164,108,.2);border:2px solid var(--green)}
.result.no{background:rgba(229,72,77,.16);border:2px solid var(--red)}
.result.neutral{background:var(--panel);border:2px solid var(--line)}
.result .big{font-size:40px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:min(480px,calc(100% - 24px));background:#fff;color:#141629;border-radius:14px;padding:12px 16px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:20;animation:up .3s}
.toast.caught{background:var(--red);color:#fff}
.toast.bribe{background:var(--gold)}
.toast.good{background:var(--green);color:#fff}
@keyframes up{from{transform:translate(-50%,20px);opacity:0}}
.modal{position:fixed;inset:0;background:rgba(5,6,15,.8);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.sheet{background:var(--bg2);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:16px;width:min(520px,100%);display:grid;gap:10px;max-height:88svh;overflow:auto}
.list{display:grid;gap:6px;max-height:38svh;overflow:auto}
.pick{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:11px 12px;text-align:left;font-weight:700;cursor:pointer;color:var(--ink)}
.pick.on{border-color:var(--red);background:rgba(229,72,77,.15)}
ul.small{margin:0;padding-left:1.1em;color:var(--muted);font-size:14px;display:grid;gap:4px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.top5{display:grid;gap:4px;font-size:15px}
.top5 .r{display:flex;gap:8px;align-items:center;padding:4px 8px;border-radius:8px}
.top5 .r.me{background:rgba(242,181,68,.18);font-weight:800}
.top5 .r b{width:1.6em}
.top5 .r span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
<script src="config.js"></script>
<script src="common.js"></script>
</head>
<body>
<div id="app">
  <header id="hd" hidden></header>
  <div class="trustline" id="tl" hidden></div>
  <main id="main"><p class="muted center">Đang tải…</p></main>
</div>
<div id="layer"></div>
<script>
(function(){
"use strict";
const { CONFIG: C, PERKS, esc, uid, openStore, sfx, signed } = window.LHL;
const SHAPES = ["▲", "◆", "●", "■"];
const qp = new URLSearchParams(location.search);
const mode = qp.get("mode") === "local" ? "local" : "firebase";
const slot = qp.get("slot") || "";
let room = (qp.get("room") || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
const $ = s => document.querySelector(s);
const P = { store: null, me: null, st: null, board: {}, results: {}, priv: {}, myAns: {}, myBr: {}, report: null, endInfo: null,
  conn: true, sub: {}, subQi: -1, sel: null, lastNote: 0, joining: false, reportSel: null, search: "", lastPhaseKey: "" };
const meKey = () => "lhl-me-" + room + (slot ? "-" + slot : "");

/* ---------- vào phòng ---------- */
async function connect() {
  try { P.store = await openStore(mode, room); }
  catch (e) { $("#main").innerHTML = `<div class="card"><h2>Không kết nối được</h2><p class="muted">${esc(e.message)}</p></div>`; return; }
  P.store.onConnection(c => { P.conn = c; paintHeader(); });
  try { P.me = JSON.parse(localStorage.getItem(meKey())); } catch (e) { P.me = null; }
  if (!P.me && qp.get("name")) { await join(qp.get("name")); return; }
  if (P.me) startSubs(); else render();
}
async function join(name) {
  name = String(name || "").trim().slice(0, 20);
  if (!name || P.joining) return;
  P.joining = true; sfx.unlock();
  const me = { id: uid(10), name };
  await P.store.set("players/" + me.id, { name, at: P.store.now() });
  localStorage.setItem(meKey(), JSON.stringify(me));
  P.me = me; P.joining = false; startSubs();
}
function startSubs() {
  const s = P.store, id = P.me.id;
  P.sub.state = s.on("state", v => {
    P.st = v;
    if (v && v.phase !== "closed" && v.qi !== P.subQi) resubQ(v.qi);
    render();
  });
  P.sub.board = s.on("board", v => { P.board = v || {}; paintHeader(); if (P.st && ["lobby", "reveal", "end"].includes(P.st.phase)) render(); });
  P.sub.results = s.on("results", v => { P.results = v || {}; if (P.st && (P.st.phase === "reveal" || P.st.phase === "backdoor")) render(); });
  P.sub.priv = s.on("private/" + id, v => {
    P.priv = v || {};
    if (P.priv.kicked) { leaveRoom("Bạn đã bị xóa khỏi phòng. Hãy vào lại với tên khác."); return; }
    if (P.priv.final) P.endInfo = P.priv.final;
    const n = P.priv.note;
    if (n && n.at > P.lastNote) { const first = P.lastNote === 0 && n.at < s.now() - 15000; P.lastNote = n.at; if (!first) toast(n.text, n.tone); }
    if (P.st && ["question", "inspres", "end", "closed"].includes(P.st.phase)) render();
  });
  P.sub.report = s.on("reports/" + id, v => { P.report = v; render(); });
  P.sub.me = s.on("players/" + id, v => {
    // MC tạo lại phòng cùng mã: tự vào lại (trừ khi bị MC xóa hoặc phiên đã đóng).
    if (v === null && P.me && !P.joining) setTimeout(() => {
      if (P.me && P.me.id === id && !P.priv.kicked && !(P.st && P.st.phase === "closed")) s.set("players/" + id, { name: P.me.name, at: s.now() });
    }, 1500);
  });
}
function resubQ(qi) {
  ["ans", "br"].forEach(k => { if (P.sub[k]) { try { P.sub[k](); } catch (e) {} P.sub[k] = null; } });
  P.subQi = qi; P.sel = null;
  if (qi == null || qi < 0) return;
  P.sub.ans = P.store.on("answers/" + qi + "/" + P.me.id, v => { P.myAns[qi] = v; render(); });
  P.sub.br = P.store.on("bribes/" + qi + "/" + P.me.id, v => { P.myBr[qi] = v; render(); });
}
function leaveRoom(msg) {
  Object.keys(P.sub).forEach(k => { if (P.sub[k]) { try { P.sub[k](); } catch (e) {} P.sub[k] = null; } });
  localStorage.removeItem(meKey());
  P.me = null; P.st = null; P.priv = {}; P.subQi = -1; P.myAns = {}; P.myBr = {}; P.report = null; P.endInfo = null;
  document.body.className = ""; render(); toast(msg, "warn");
}

/* ---------- tiện ích ---------- */
function ranked() { return Object.entries(P.board).map(([id, v]) => ({ id, name: v.name, score: v.score })).sort((a, b) => b.score - a.score || a.name.localeCompare(b.name)); }
function myInfo() {
  const arr = ranked(), i = arr.findIndex(x => x.id === P.me.id);
  if (i < 0) return { score: C.startScore, rank: 0, of: arr.length, name: P.me.name };
  const rank = arr.findIndex(x => x.score === arr[i].score) + 1;
  return { score: arr[i].score, rank, of: arr.length, name: arr[i].name };
}
const myScore = () => myInfo().score;
const nameOf = id => (P.board[id] ? P.board[id].name : "?");
function hasWrong() {
  const qi = P.st ? P.st.qi : 0;
  for (let j = qi - 1; j >= 0; j--) { const r = P.results[j] && P.results[j][P.me.id]; if (r && !r.ok) return true; }
  return false;
}
function remaining() { return P.st && P.st.endsAt ? Math.max(0, P.st.endsAt - P.store.now()) : 0; }
function toast(text, tone) {
  const t = document.createElement("div"); t.className = "toast " + (tone || ""); t.textContent = text;
  document.body.appendChild(t); setTimeout(() => t.remove(), 4500);
  if (navigator.vibrate) navigator.vibrate(tone === "caught" ? [200, 80, 200] : 80);
}
function top5HTML() {
  const arr = ranked(), me = P.me.id;
  if (!arr.length) return "";
  const top = arr.slice(0, 5);
  const mine = arr.findIndex(x => x.id === me);
  const rows = top.map((x, i) => `<div class="r ${x.id === me ? "me" : ""}"><b>${i + 1}</b><span>${esc(x.name)}</span><b style="width:auto">${x.score}</b></div>`);
  if (mine >= 5) rows.push(`<div class="r me"><b>${mine + 1}</b><span>${esc(arr[mine].name)} (bạn)</span><b style="width:auto">${arr[mine].score}</b></div>`);
  return `<div class="card"><b>Bảng xếp hạng</b><div class="top5">${rows.join("")}</div></div>`;
}

/* ---------- vẽ ---------- */
function paintHeader() {
  const hd = $("#hd"), tl = $("#tl");
  if (!P.me) { hd.hidden = true; tl.hidden = true; return; }
  const me = myInfo();
  hd.hidden = false;
  hd.innerHTML = `<span class="dot ${P.conn ? "" : "off"}" title="${P.conn ? "Đã kết nối" : "Mất kết nối"}"></span>
    <span class="nm">${esc(me.name)}</span>
    <span class="center"><div class="sc">${me.score}</div><div class="rk">${me.rank ? "hạng " + me.rank + "/" + me.of : ""}</div></span>`;
  if (P.st && P.st.phase !== "lobby" && P.st.phase !== "closed") {
    const t = P.st.trust, cls = t >= 70 ? "" : t >= 50 ? "mid" : "low";
    tl.hidden = false;
    tl.innerHTML = `<div class="trust ${cls}"><span class="muted">Niềm tin của lớp</span><div class="tbar"><i style="width:${t}%"></i></div><b>${t}%</b></div>`;
  } else tl.hidden = true;
}
function reportBtn() {
  if (!P.st || !["reveal", "bdsum", "inspect", "inspres", "act"].includes(P.st.phase)) return "";
  if (P.report) return `<p class="muted center" style="font-size:14px">Bạn đã tố giác <b>${esc(nameOf(P.report.target))}</b>. Kết quả có ở lần thanh tra tới.</p>`;
  if (Object.keys(P.board).length < 2) return "";
  const rw = C.reportReward[(P.st.act || 1) - 1];
  return `<button class="btn ghost" data-act="report">Tố giác một bạn (đúng +${rw}, sai −${C.reportFalsePenalty})</button>`;
}
function render() {
  paintHeader();
  const m = $("#main");
  if (!room) {
    m.innerHTML = `<div class="card"><h1>LIÊM <span style="color:var(--gold);font-weight:500">hay</span> LÁCH?</h1>
      <p class="muted">Nhập mã phòng trên màn hình chiếu.</p>
      <input class="field" id="roomIn" maxlength="8" autocapitalize="characters" placeholder="VD: KQTR" aria-label="Mã phòng">
      <button class="btn" data-act="room">Vào</button></div>`;
    return;
  }
  if (!P.me) {
    m.innerHTML = `<div class="card"><h1>Phòng ${esc(room)}</h1><p class="muted">Nhập tên của bạn (người chơi cá nhân). Nên dùng tên thật để các bạn nhận ra.</p>
      <input class="field" id="nameIn" maxlength="20" placeholder="Tên của bạn" autocomplete="off" aria-label="Tên của bạn">
      <button class="btn" data-act="join">Vào phòng</button></div>`;
    return;
  }
  const st = P.st;
  document.body.className = st && (st.phase === "backdoor" || st.phase === "bdsum") ? "night" : st && (st.phase === "inspect" || st.phase === "inspres" || st.phase === "act") ? "siren" : "";
  if (!st) { m.innerHTML = `<div class="card center"><h2>Đã vào phòng ${esc(room)}</h2><p class="muted">Chờ MC tạo ván…</p></div>`; return; }
  const key = st.phase + ":" + st.qi;
  if (st.phase === "reveal" && key !== P.lastPhaseKey) {
    const r = P.results[st.qi] && P.results[st.qi][P.me.id];
    if (r) { P.lastPhaseKey = key; if (r.ok) sfx.good(); else sfx.bad(); }
  }
  m.innerHTML = ({ lobby, backdoor, bdsum, question, reveal, inspect, inspres, act, end, closed }[st.phase] || lobby)();
  tick();
}
function lobby() {
  const n = Object.keys(P.board).length;
  return `<div class="card center"><h2>Bạn đã vào phòng ${esc(room)}</h2><p class="big" style="font-size:30px">${esc(myInfo().name)}</p>
      <p class="muted">${n ? n + " người đã vào. " : ""}Chờ MC bắt đầu…</p></div>
    <div class="card"><b>Luật nhanh (chơi cá nhân)</b><ul class="small">
      <li>Vốn ${C.startScore} điểm. Trả lời đúng +${C.basePoints}, nhanh thêm tới +${C.speedBonus}.</li>
      <li>Trước mỗi câu (từ câu 2) có thể bí mật đưa phong bì để lấy lợi thế.</li>
      <li>Thanh tra có thể phát hiện: thu hồi lợi ích + phạt gấp ${C.fineMultiplier}. Càng đưa nhiều càng dễ lộ.</li>
      <li>Mỗi đợt thanh tra bạn được tố giác 1 bạn khác: đúng được thưởng, sai bị trừ.</li>
      <li>Niềm tin của lớp dưới ${C.trustLimit}% khi hết ván: ai cũng bị trừ ${C.trustPenaltyRate * 100}%.</li></ul></div>`;
}
function backdoor() {
  const qi = P.st.qi, mine = P.myBr[qi];
  if (mine) {
    const p = PERKS[mine.perk];
    return `<div class="card center"><h2>Cửa sau</h2><div class="cd" id="cd">–</div>
      ${p ? `<p>Bạn đã chọn đưa phong bì <b>${esc(p.name)}</b> (−${p.price}).</p><p class="muted">Giữ bí mật nhé… thanh tra có thể vào cuộc bất cứ lúc nào.</p>`
          : `<p><b>Bạn chọn giữ liêm chính.</b></p><p class="muted">Không mất gì, không sợ thanh tra.</p>`}</div>`;
  }
  const sc = myScore(), wrong = hasWrong();
  const cards = Object.entries(PERKS).map(([k, p]) => {
    const dis = sc < p.price || (k === "xoa" && !wrong);
    const why = sc < p.price ? "Không đủ điểm" : (k === "xoa" && !wrong ? "Bạn chưa sai câu nào" : p.desc);
    return `<button class="perk ${P.sel === k ? "on" : ""}" data-act="sel" data-v="${k}" ${dis ? "disabled" : ""}><div class="row"><b>${esc(p.name)}</b><span class="p">${p.price} điểm</span></div><span>${esc(why)}</span></button>`;
  }).join("");
  return `<div class="center"><h1>Cửa sau đang mở</h1><p class="muted">Quyết định bí mật. Không ai biết… trừ người gác cổng.</p></div>
    <div class="cd" id="cd">–</div>${cards}
    <button class="btn red" data-act="bribe" ${P.sel ? "" : "disabled"}>${P.sel ? "Đưa phong bì " + esc(PERKS[P.sel].name) + " (−" + PERKS[P.sel].price + ")" : "Chọn một phong bì"}</button>
    <button class="btn" data-act="clean">Giữ liêm chính</button>
    <p class="muted center" style="font-size:13px">Mỗi phong bì làm niềm tin của cả lớp giảm.</p>`;
}
function bdsum() {
  return `<div class="card center"><h2>Cửa sau đã đóng</h2><p class="muted">Chuẩn bị câu ${P.st.qi + 1}…</p></div>${reportBtn()}`;
}
function question() {
  const st = P.st, qi = st.qi, q = st.q; if (!q) return lobby();
  const mine = P.myAns[qi];
  const elim = P.priv.elim && P.priv.elim.qi === qi ? P.priv.elim.keep : null;
  const br = P.myBr[qi], doubled = br && br.perk === "chay";
  const badges = `${elim ? `<span class="badge">Lộ đề: còn 2 đáp án</span>` : ""} ${doubled ? `<span class="badge">Chạy điểm ×2</span>` : ""}`;
  if (mine) {
    return `<div class="row"><b>Câu ${qi + 1}/${st.total}</b><div class="cd" id="cd">–</div></div>
      <div class="result neutral"><div class="big shape">${SHAPES[mine.c] || "?"}</div><b>Đã chốt: ${esc(q.o[mine.c] || "")}</b><p class="muted">Chờ mọi người trả lời…</p></div>`;
  }
  return `<div class="row"><b>Câu ${qi + 1}/${st.total}</b><div class="cd" id="cd">–</div></div>
    ${badges.trim() ? `<div>${badges}</div>` : ""}
    <div class="qt">${esc(q.t)}</div>
    <div class="ans">${q.o.map((o, i) => `<button class="o${i} ${elim && !elim.includes(i) ? "gone" : ""}" data-act="ans" data-v="${i}" ${elim && !elim.includes(i) ? "disabled aria-hidden=\"true\"" : ""}><span class="shape">${SHAPES[i]}</span><span>${esc(o)}</span></button>`).join("")}</div>`;
}
function reveal() {
  const st = P.st, qi = st.qi, r = P.results[qi] && P.results[qi][P.me.id], mine = P.myAns[qi];
  const correct = st.reveal ? st.q.o[st.reveal.a] : "";
  const box = r && r.ok
    ? `<div class="result ok"><div class="big">Đúng!</div><b>+${r.pts} điểm</b></div>`
    : `<div class="result no"><div class="big">${mine ? "Sai" : "Hết giờ"}</div><b>${mine ? "Không có điểm" : "Bạn chưa trả lời"}</b></div>`;
  return `${box}<div class="card"><span class="muted">Đáp án đúng</span><b>${esc(correct)}</b>${st.reveal ? `<p class="muted" style="font-size:14px">${esc(st.reveal.e)}</p>` : ""}</div>${top5HTML()}${reportBtn()}`;
}
function inspect() {
  return `<div class="card center"><h2>Thanh tra chuẩn bị vào cuộc</h2><p>Màn ${P.st.act}: mỗi phong bì có <b>${Math.round((P.st.rate || 0) * 100)}%</b> khả năng bị phát hiện.</p>
    <p class="muted">Bạn nghi ai đã đưa phong bì? Xem bảng xếp hạng: ai tăng điểm bất thường?</p></div>${top5HTML()}${reportBtn()}`;
}
function inspres() {
  // Firebase bỏ mảng rỗng, nên luôn đặt mặc định.
  const I0 = P.st.insp || {}, I = { no: I0.no, caught: I0.caught || [], repN: I0.repN || 0, repOk: I0.repOk || 0 }, id = P.me.id;
  const mine = I.caught.filter(c => c.p === id);
  const rr = P.priv.repResult && P.priv.repResult.no === I.no ? P.priv.repResult : null;
  let html = "";
  if (mine.length) {
    const lost = mine.reduce((s, c) => s + c.claw + c.fine, 0);
    html += `<div class="result no"><div class="big">Bị phát hiện</div><b>${mine.map(c => esc(PERKS[c.perk].name)).join(", ")}: −${lost} điểm</b><p class="muted">Thu hồi lợi ích và phạt gấp ${C.fineMultiplier}.</p></div>`;
  } else html += `<div class="result neutral"><div class="big" style="font-size:28px">Không có tên bạn</div><p class="muted">trong biên bản thanh tra số ${I.no || 1}.</p></div>`;
  if (rr) html += `<div class="result ${rr.ok ? "ok" : "no"}"><b>Tố giác ${esc(rr.target)}: ${rr.ok ? "ĐÚNG" : "SAI"} (${signed(rr.d)})</b>${rr.capped ? `<p class="muted">Đã có 3 người tố trước bạn nên không có thưởng.</p>` : ""}</div>`;
  const others = I.caught.filter(c => c.p !== id).map(c => esc(c.name));
  if (others.length) html += `<p class="muted center">Bị phát hiện: ${[...new Set(others)].slice(0, 8).join(", ")}${others.length > 8 ? "…" : ""}</p>`;
  return html + top5HTML() + reportBtn();
}
function act() {
  return `<div class="card center"><span class="badge red">Màn 2</span><h1>Siết kỷ luật</h1>
    <ul class="small" style="text-align:left"><li>Thanh tra phát hiện ${C.detectRate[1] * 100}% (trước là ${C.detectRate[0] * 100}%).</li><li>Tố giác đúng +${C.reportReward[1]}.</li></ul>
    <p>Bạn còn dám đưa phong bì không?</p></div>${reportBtn()}`;
}
function endCard(closed) {
  const F = P.endInfo, me = myInfo();
  if (!F) return `<div class="result neutral"><b>${closed ? "Phiên chơi đã kết thúc" : "Ván đã kết thúc"}</b></div>`;
  const titles = [F.clean ? `<span class="badge">Liêm chính +${C.cleanBonus}</span>` : "", F.repOk ? `<span class="badge">Thám tử ×${F.repOk}</span>` : "",
    F.caught ? `<span class="badge red">Bị phát hiện ×${F.caught}</span>` : ""].filter(Boolean).join(" ");
  return `<div class="result ${F.rank === 1 ? "ok" : "neutral"}"><span class="muted">Hạng</span><div class="big">${F.rank}/${F.of}</div><b>${F.score} điểm</b></div>
    <div class="card">
      <div class="row"><span>Trả lời đúng</span><b>${F.correct}/${F.qDone}</b></div>
      <div class="row"><span>Phong bì bạn đã đưa</span><b>${F.bribes}</b></div>
      <div class="row"><span>Bị phát hiện</span><b>${F.caught}</b></div>
      <div class="row"><span>Tố giác đúng / sai</span><b>${F.repOk} / ${F.repBad}</b></div>
      ${titles ? `<div>${titles}</div>` : ""}
    </div>`;
}
function end() {
  const F = P.st.final;
  return endCard(false) + `<div class="card center"><div class="row"><span>Niềm tin của lớp</span><b>${F ? F.trust : P.st.trust}%</b></div>
    ${F && F.trustFail ? `<p class="muted">Dưới ${C.trustLimit}%: mọi người bị trừ ${C.trustPenaltyRate * 100}% điểm.</p>` : ""}</div>
    <p class="center muted">Nhìn lên màn hình chiếu: bảng thành tích và sự thật được bật mí!</p>`;
}
function closed() {
  return `<div class="card center"><h1>Phiên chơi đã kết thúc</h1><p class="muted">Cảm ơn bạn đã tham gia. Dữ liệu phòng đã được xóa.</p></div>` + endCard(true);
}

/* ---------- tố giác ---------- */
function reportListHTML() {
  const q = P.search.trim().toLowerCase();
  const arr = ranked().filter(x => x.id !== P.me.id && (!q || x.name.toLowerCase().includes(q))).sort((a, b) => a.name.localeCompare(b.name));
  return arr.map(x => `<button class="pick ${P.reportSel === x.id ? "on" : ""}" data-act="rsel" data-v="${x.id}">${esc(x.name)}</button>`).join("") || `<p class="muted">Không tìm thấy.</p>`;
}
function openReport() {
  const rw = C.reportReward[(P.st.act || 1) - 1];
  $("#layer").innerHTML = `<div class="modal" data-act="closeModal"><div class="sheet" data-stop="1">
      <h2>Tố giác bạn nào?</h2>
      <p class="muted" style="font-size:14px">Đúng (bạn đó có phong bì chưa bị phát hiện): +${rw}. Sai: −${C.reportFalsePenalty}. Mỗi đợt thanh tra được tố giác 1 lần, xử lý ở lần thanh tra kế tiếp.</p>
      <input class="field" id="rsearch" placeholder="Tìm tên…" autocomplete="off" value="${esc(P.search)}" aria-label="Tìm tên">
      <div class="list" id="rlist">${reportListHTML()}</div>
      <button class="btn red" id="rsend" data-act="rsend" ${P.reportSel ? "" : "disabled"}>Gửi đơn tố giác</button>
      <button class="btn ghost" data-act="closeModal">Hủy</button></div></div>`;
}
function refreshReport() { const l = $("#rlist"); if (l) l.innerHTML = reportListHTML(); const b = $("#rsend"); if (b) b.disabled = !P.reportSel; }

/* ---------- đồng hồ ---------- */
function tick() {
  const el = $("#cd"); if (!el || !P.st) return;
  const s = Math.ceil(remaining() / 1000);
  el.textContent = s + "s"; el.classList.toggle("low", s <= 5);
}
setInterval(tick, 250);

/* ---------- sự kiện ---------- */
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  if (b.dataset.act === "closeModal" && e.target.closest("[data-stop]") && b.classList.contains("modal")) return;
  if (b.disabled) return;
  const a = b.dataset.act, st = P.st;
  if (a === "room") { const v = ($("#roomIn").value || "").toUpperCase().replace(/[^A-Z0-9]/g, ""); if (v) { room = v; history.replaceState(null, "", "?room=" + v + (mode === "local" ? "&mode=local" : "")); $("#main").innerHTML = `<p class="muted center">Đang kết nối…</p>`; connect(); } }
  else if (a === "join") join($("#nameIn").value);
  else if (a === "sel") { P.sel = b.dataset.v; render(); }
  else if (a === "bribe" && st && st.phase === "backdoor" && P.sel && !P.myBr[st.qi]) {
    P.myBr[st.qi] = { perk: P.sel }; render();
    await P.store.set("bribes/" + st.qi + "/" + P.me.id, { perk: P.sel, at: P.store.now() });
  }
  else if (a === "clean" && st && st.phase === "backdoor" && !P.myBr[st.qi]) {
    P.myBr[st.qi] = { perk: "none" }; render();
    await P.store.set("bribes/" + st.qi + "/" + P.me.id, { perk: "none", at: P.store.now() });
  }
  else if (a === "ans" && st && st.phase === "question" && !P.myAns[st.qi]) {
    const c = +b.dataset.v; P.myAns[st.qi] = { c }; render();
    if (navigator.vibrate) navigator.vibrate(30);
    await P.store.set("answers/" + st.qi + "/" + P.me.id, { c, at: P.store.now() });
  }
  else if (a === "report") { P.reportSel = null; P.search = ""; openReport(); }
  else if (a === "rsel") { P.reportSel = b.dataset.v; refreshReport(); }
  else if (a === "rsend" && P.reportSel && !P.report) {
    const target = P.reportSel; $("#layer").innerHTML = "";
    P.report = { target }; render();
    await P.store.set("reports/" + P.me.id, { target, at: P.store.now() });
    toast("Đã gửi đơn tố giác " + nameOf(target) + ". Kết quả có ở lần thanh tra tới.", "info");
  }
  else if (a === "closeModal") { $("#layer").innerHTML = ""; }
});
document.addEventListener("input", e => { if (e.target.id === "rsearch") { P.search = e.target.value; refreshReport(); } });
document.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  if (e.target.id === "nameIn") join(e.target.value);
  if (e.target.id === "roomIn") document.querySelector("[data-act='room']").click();
});

if (room) connect(); else render();
})();
</script>
</body>
</html>
